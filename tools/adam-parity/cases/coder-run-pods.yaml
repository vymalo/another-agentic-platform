# examples/coder.yaml with run pods on (D15a): the coder's commands run in a pod of their own. The netcup coder as it is, a GitHub App
# by owners, a per-replica `work` volume (ReadWriteOnce, so run pods go where the coder is), one worker. The chart's defaults for
# everything run pods: the operator chart's `runPods` block and `runPodClasses.standard` are the same values, and a test holds them equal.
fullnameOverride: coder
image:
  tag: sha-0391809
topology: combined
replicaCount: 1
config:
  modelBaseUrlFromSecret: true
  modelBaseUrl: ""
  model: coding-model
  opencodeModel: coding-model
  publicUrl: ""
  workers: 4
  maxCheckCycles: 3
  checkTimeoutSecs: 900
  workspaceSweepSecs: 300
  allowedRepoHosts: [github.com]
  githubApiUrl: https://api.github.com
  prDraft: true
  gitAuthorName: "bored-giant-panda[bot]"
  gitAuthorEmail: "337696346+bored-giant-panda[bot]@users.noreply.github.com"
runPods:
  enabled: true
  # The operator does not swap the resources of the coder container when run pods are on: the case's operator side names these
  # (the chart's `runPods.coderResources` defaults) as the config's own.
  coderResources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi
github:
  auth: app
  createRepoOwners: []
  app:
    id: Iv23li4m1ZrQ8wdwjnQH
    owners: [vymalo]
    privateKeySecret: coder-github-app
githubMcp:
  enabled: true
  port: 8082
  host: ""
mcp:
  websearch:
    url: http://another-agentic-websearch.another-agentic-system.svc:8080/mcp
    header: Authorization
    valuePrefix: "Bearer "
    optional: true
    allowInsecure: true
  context7:
    enabled: true
    url: https://mcp.context7.com/mcp
    header: Authorization
    valuePrefix: "Bearer "
    optional: true
database:
  enabled: false
  existingSecret:
    name: coder-db-uri
    key: uri
externalSecrets:
  enabled: true
  targetSecretName: coder-secrets
workspace:
  placement: ""
persistence:
  size: 20Gi
  storageClass: longhorn
terminationGracePeriodSeconds: 120
resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 6Gi
networkPolicy:
  enabled: true
  allowedNamespace: another-agentic-system
