# Refused: release.defaultChannel is 33 characters; a channel name is at most 32 (a bound of the schema).
# expect: Too long: may not be more than 32 bytes
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-release-default-channel-too-long
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  release:
    defaultChannel: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    channels:
      aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa: { configRef: { name: chat } }
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    topology: combined
    workers: 1
  store:
    postgres:
      secretRef:
        name: db
        key: uri
