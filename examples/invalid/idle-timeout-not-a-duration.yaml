# Refused: scaling.idleTimeout is soon.
# expect: scaling.idleTimeout must be a duration of 1m to 24h
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-idle-timeout-not-a-duration
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    topology: combined
    workers: 1
    idleTimeout: soon
  store:
    postgres:
      secretRef:
        name: db
        key: uri
