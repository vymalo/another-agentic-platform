# Refused: a ModelEndpoint's title is empty; at least 1 character (a bound of the schema, not a CEL rule).
# expect: spec.title in body should be at least 1 chars long
apiVersion: agents.vymalo.com/v1alpha1
kind: ModelEndpoint
metadata:
  name: invalid-endpoint-title-empty
  namespace: another-agentic-system
spec:
  title: ""
  baseUrl:
    value: https://gateway.example.invalid/v1
  apiKeySecretRef:
    name: s
    key: GATEWAY_API_KEY
