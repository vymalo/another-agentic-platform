# Refused: scaling.wakeAhead is over 1h.
# expect: scaling.wakeAhead is a duration from 10s to 1h
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-sleep
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    idleTimeout: 15m
    wakeAhead: 2h
  store:
    postgres:
      secretRef:
        name: db
        key: uri
