# Refused: an access.audience value has 65 characters; at most 64 (a bound of the schema, not a CEL rule).
# expect: Too long: may not be more than 64 bytes
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-audience-value-too-long
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    topology: combined
    workers: 1
  store:
    postgres:
      secretRef:
        name: db
        key: uri
  access:
    audience:
      - aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
