# Refused: a ModelEndpoint's baseUrl.secretRef.key is empty; at least 1 character (a bound of the schema, not a CEL rule).
# expect: spec.baseUrl.secretRef.key in body should be at least 1 chars long
apiVersion: agents.vymalo.com/v1alpha1
kind: ModelEndpoint
metadata:
  name: invalid-endpoint-base-url-secret-key-empty
  namespace: another-agentic-system
spec:
  title: Gateway
  baseUrl:
    secretRef:
      name: s
      key: ""
  apiKeySecretRef:
    name: s
    key: GATEWAY_API_KEY
