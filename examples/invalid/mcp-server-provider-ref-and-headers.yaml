# Refused: an MCP server has a providerRef and headers; the reference is exclusive with the inline headers.
# expect: mcpServers.providerRef is exclusive with url and headers
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentConfig
metadata:
  name: invalid-mcp-provider-ref-and-headers
  namespace: another-agentic-system
spec:
  harness:
    type: adam-rs
    adam:
      binary: adam-agent
      agent:
        folder:
          files:
            instructions.md: |
              Hello.
  model:
    model: m
    baseUrl:
      value: https://gateway.example.invalid/v1
    apiKeySecretRef:
      name: s
      key: MODEL_API_KEY
  tools:
    mcpServers:
      search:
        providerRef:
          name: websearch
        headers:
          Authorization:
            prefix: "Bearer "
            secretRef:
              name: s
              key: SEARCH_MCP_TOKEN
  environment:
    image:
      ref: ghcr.io/vymalo/another-adam-rs/coder:sha-0391809
