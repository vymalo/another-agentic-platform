# Refused: a header's secretRef.name of a ToolProvider is empty; at least 1 character (a bound of the schema, not a CEL rule).
# expect: spec.mcp.headers.Authorization.secretRef.name in body should be at least 1 chars long
apiVersion: agents.vymalo.com/v1alpha1
kind: ToolProvider
metadata:
  name: invalid-provider-header-secret-name-empty
  namespace: another-agentic-system
spec:
  title: Web search
  mcp:
    url: http://another-agentic-websearch.another-agentic-system.svc:8080/mcp
    headers:
      Authorization:
        secretRef:
          name: ""
          key: SEARCH_MCP_TOKEN
