# Refused: Port 0 is not a port.
# expect: Invalid value: 0: spec.scaling.activityProbe.httpGet.port in body should be greater than or equal to 1
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-sleep
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    idleTimeout: 10m
    activityProbe:
      httpGet:
        port: 0
        path: /internal/activity
  store:
    postgres:
      secretRef:
        name: db
        key: uri
