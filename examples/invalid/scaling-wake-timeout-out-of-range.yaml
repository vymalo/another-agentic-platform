# Refused: scaling.wakeTimeout is over 5m.
# expect: scaling.wakeTimeout is a duration from 5s to 5m, such as 60s
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-sleep
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    idleTimeout: 15m
    wakeTimeout: 10m
  store:
    postgres:
      secretRef:
        name: db
        key: uri
