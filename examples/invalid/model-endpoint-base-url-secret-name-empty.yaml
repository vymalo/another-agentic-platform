# Refused: a ModelEndpoint's baseUrl.secretRef.name is empty; at least 1 character (a bound of the schema, not a CEL rule).
# expect: spec.baseUrl.secretRef.name in body should be at least 1 chars long
apiVersion: agents.vymalo.com/v1alpha1
kind: ModelEndpoint
metadata:
  name: invalid-endpoint-base-url-secret-name-empty
  namespace: another-agentic-system
spec:
  title: Gateway
  baseUrl:
    secretRef:
      name: ""
      key: GATEWAY_BASE_URL
  apiKeySecretRef:
    name: s
    key: GATEWAY_API_KEY
