# Refused: The probe's path is relative.
# expect: scaling.activityProbe.httpGet.path is an absolute path: it starts with `/`
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-sleep
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    idleTimeout: 10m
    activityProbe:
      httpGet:
        port: 8081
        path: internal/activity
  store:
    postgres:
      secretRef:
        name: db
        key: uri
