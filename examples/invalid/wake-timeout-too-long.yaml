# Refused: scaling.wakeTimeout is 10m.
# expect: scaling.wakeTimeout must be a duration of 5s to 5m
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: invalid-wake-timeout-too-long
  namespace: another-agentic-system
spec:
  configRef:
    name: chat
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: tokens
        key: A2A_BEARER_TOKENS
  scaling:
    topology: combined
    workers: 1
    wakeTimeout: 10m
  store:
    postgres:
      secretRef:
        name: db
        key: uri
