# The netcup coder (examples/coder.yaml) with run pods on (§60a, slice D15a): the commands of a run, run_command, run_checks and
# OpenCode, run in a pod of their own that sees only its own run, and not in the coder's container, where they could read the GitHub
# App's private key. The one field is coder.runPods.sizeClass, a class of the operator chart's `runPodClasses`. The coder's own pod
# can be small then, since no build runs in it (the operator does not shrink it for you). Needs an operator whose chart has run pods
# on (`runPods.enabled`); otherwise the config is `ConfigInvalid`, saying so.
# Every secret is a reference to a Secret key; no value is in this file.
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentService
metadata:
  name: coder
  namespace: another-agentic-system
spec:
  description: Coding task to verified pull request.
  configRef:
    name: coder
  interfaces:
    a2a:
      enabled: true
      bearerTokensSecretRef:
        name: coder-secrets
        key: A2A_BEARER_TOKENS
      publicUrl: "" # empty: http://<name>.<ns>.svc:8080/
    responses:
      enabled: false # v0: CEL refuses true
    mcp:
      enabled: false # v0: CEL refuses true
  scaling:
    topology: combined # combined | split
    workers: 1
    # front: { replicas: 1 } # split only; a PodDisruptionBudget when > 1
  suspend: false
  store:
    postgres:
      secretRef:
        name: coder-db-uri
        key: uri
      # or an operator-owned CloudNativePG cluster:
      # cnpg: { instances: 1, storage: { size: 5Gi, storageClass: longhorn } }
  access:
    allowFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: another-agentic-system
  registry:
    title: Coder
    tags: [coding, git]
  deletionPolicy: Retain # Retain | Delete
---
apiVersion: agents.vymalo.com/v1alpha1
kind: AgentConfig
metadata:
  name: coder
  namespace: another-agentic-system
spec:
  harness:
    type: adam-rs
    adam:
      binary: adam-coder # adam-coder | adam-agent
      agent:
        embedded: {}
      coder:
        workers: 4
        maxCheckCycles: 3
        checkTimeoutSecs: 900
        workspaceSweepSecs: 300
        workspacePlacement: "" # "" | shared | affinity | isolated
        allowedRepoHosts: [github.com]
        githubApiUrl: https://api.github.com
        prDraft: true
        gitAuthor:
          name: "bored-giant-panda[bot]"
          email: "337696346+bored-giant-panda[bot]@users.noreply.github.com"
        createRepoOwners: []
        opencodeModel: coding-model
        runPods:
          sizeClass: standard # a name of the operator chart's runPodClasses
        github:
          app:
            id: Iv23li4m1ZrQ8wdwjnQH # the App's client ID: public, not a secret
            owners: [vymalo] # or installationId: 12345 (exactly one of the two)
            privateKeySecretRef:
              name: coder-github-app
              key: private-key.pem
          # token: { secretRef: { name: coder-secrets, key: GITHUB_TOKEN } } # instead of app, never both
  model:
    model: coding-model
    baseUrl: # or { value: https://…/v1 }
      secretRef:
        name: coder-secrets
        key: MODEL_BASE_URL
    apiKeySecretRef:
      name: coder-secrets
      key: MODEL_API_KEY
  tools:
    githubMcp:
      sidecar: true
      port: 8082
      host: ""
    mcpServers:
      websearch:
        url: http://another-agentic-websearch.another-agentic-system.svc:8080/mcp
        headers:
          Authorization:
            prefix: "Bearer "
            secretRef:
              name: coder-secrets
              key: SEARCH_MCP_TOKEN
        optional: true
      context7:
        url: https://mcp.context7.com/mcp
        headers:
          Authorization:
            prefix: "Bearer "
            secretRef:
              name: coder-secrets
              key: CONTEXT7_API_KEY
        optional: true
    allowInsecureHttp: true
  environment:
    image:
      # tag and digest (digest of the tag read from ghcr.io on 2026-10-05)
      ref: ghcr.io/vymalo/another-adam-rs/coder:sha-0391809@sha256:814d8ee329a5e4d8634e8a82532c035999c4be27aac086508b742a635449ea40
    resources: # the coder alone: no build runs in it with run pods on
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 1Gi
    volumes:
      - name: work
        scope: agent
        mountPath: /work
        source:
          persistent:
            size: 20Gi
            storageClass: longhorn
            perReplica: true
    terminationGracePeriodSeconds: 120
  security:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    fsGroupChangePolicy: OnRootMismatch
  extraEnv: {}
