[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/ports",
    "crates/domain",
    "crates/runtime-kubernetes",
    "crates/store-secret",
    "crates/store-cnpg",
    "crates/controller",
    "bin/operator",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/vymalo/another-agentic-platform"
authors = ["Stephane Segning Lambou / vymalo"]
publish = false

[workspace.dependencies]
aap-api = { path = "crates/api" }
aap-domain = { path = "crates/domain" }
aap-ports = { path = "crates/ports" }
aap-runtime-kubernetes = { path = "crates/runtime-kubernetes" }
aap-store-secret = { path = "crates/store-secret" }
aap-store-cnpg = { path = "crates/store-cnpg" }
aap-controller = { path = "crates/controller" }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_32", "schemars"] }
kube = { version = "4.0.0", default-features = false, features = ["derive"] }
proptest = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
