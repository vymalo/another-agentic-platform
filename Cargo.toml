[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/ports",
    "crates/domain",
    "crates/forms",
    "crates/runtime-kubernetes",
    "crates/store-secret",
    "crates/store-cnpg",
    "crates/objects-kubernetes",
    "crates/auth-oidc",
    "crates/auth-workload",
    "crates/registry",
    "crates/leader-kubernetes",
    "crates/controller",
    "crates/platform-api",
    "crates/platform-client",
    "crates/trace",
    "crates/trace-otlp",
    "crates/tool-probe",
    "crates/activity-http",
    "crates/activator",
    "crates/usage",
    "crates/usage-otlp",
    "bin/operator",
    "bin/api",
    "bin/cli",
]

[workspace.package]
version = "0.1.0" # x-release-please-version
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/vymalo/another-agentic-platform"
authors = ["Stephane Segning Lambou / vymalo"]
publish = false

[workspace.dependencies]
aap-api = { path = "crates/api" }
aap-domain = { path = "crates/domain" }
aap-forms = { path = "crates/forms" }
aap-ports = { path = "crates/ports" }
aap-runtime-kubernetes = { path = "crates/runtime-kubernetes" }
aap-store-secret = { path = "crates/store-secret" }
aap-store-cnpg = { path = "crates/store-cnpg" }
aap-objects-kubernetes = { path = "crates/objects-kubernetes" }
aap-auth-oidc = { path = "crates/auth-oidc" }
aap-auth-workload = { path = "crates/auth-workload" }
aap-registry = { path = "crates/registry" }
aap-leader-kubernetes = { path = "crates/leader-kubernetes" }
aap-controller = { path = "crates/controller" }
aap-platform-api = { path = "crates/platform-api" }
aap-platform-client = { path = "crates/platform-client" }
aap-trace = { path = "crates/trace" }
aap-usage = { path = "crates/usage" }
aap-usage-otlp = { path = "crates/usage-otlp" }
aap-trace-otlp = { path = "crates/trace-otlp" }
aap-tool-probe = { path = "crates/tool-probe" }
aap-activity-http = { path = "crates/activity-http" }
aap-activator = { path = "crates/activator" }
anyhow = "1"
aws-lc-rs = "1.15"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
# CBOR as the second media type of the Platform API (AD-061): pinned exactly; it adds ciborium-io, ciborium-ll and half, no HTTP or TLS stack.
ciborium = "=0.2.2"
clap = { version = "4", features = ["derive", "env"] }
# Only `aapctl login`: 32 bytes of OS randomness for the PKCE verifier and the state (already in the lock file, 0.2.17).
getrandom = "0.2"
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# One crypto library for JWS, `aws-lc-rs`, as the system's orchestrator has (jsonwebtoken has no `ring` backend);
# TLS stays rustls with ring (kube), which is why reqwest is 0.12: 0.13's `rustls` feature is aws-lc-rs.
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_32", "schemars"] }
kube = { version = "4.0.0", default-features = false, features = ["derive"] }
proptest = "1"
# Only `aapctl`'s safe read of its 0600 file: `geteuid` and `O_NOFOLLOW` without `unsafe` (already in the lock file through tempfile).
rustix = { version = "1", default-features = false, features = ["std", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
# The workload authenticator (ANR-1010, AD-065): rustls-webpki is already in the lock through rustls,
# with ring as its provider, so this adds no TLS stack; x509-parser reads the URI SAN, which webpki does not expose.
rustls-pki-types = "1"
rustls-webpki = { version = "0.103", default-features = false, features = ["std", "ring"] }
x509-parser = "0.18"
# The workload listener (ANR-1011): rustls with ring, as everywhere in the lock (gate 1 of tools/check-dependencies.sh), and a PKI minted by
# the tests of the crate that has one (never in a binary). Neither adds a TLS stack; rcgen is a dev-only, ring-backed generator.
rustls = { version = "0.23", default-features = false, features = ["logging", "ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", default-features = false }
# `util` (`service_fn`, `ServiceExt::oneshot`) is what tests drive a router and a fake API server with; a crate that uses it
# names the feature.
tower = { version = "0.5", default-features = false }
# Only the CORS layer of the Platform API (D7a): the origin check is tower-http's, the list of origins is ours.
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
