[workspace]
resolver = "3"
members = [
    "crates/api",
    "crates/ports",
    "crates/domain",
    "crates/forms",
    "crates/runtime-kubernetes",
    "crates/store-secret",
    "crates/store-cnpg",
    "crates/objects-kubernetes",
    "crates/auth-oidc",
    "crates/registry",
    "crates/controller",
    "crates/platform-api",
    "bin/operator",
    "bin/api",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/vymalo/another-agentic-platform"
authors = ["Stephane Segning Lambou / vymalo"]
publish = false

[workspace.dependencies]
aap-api = { path = "crates/api" }
aap-domain = { path = "crates/domain" }
aap-forms = { path = "crates/forms" }
aap-ports = { path = "crates/ports" }
aap-runtime-kubernetes = { path = "crates/runtime-kubernetes" }
aap-store-secret = { path = "crates/store-secret" }
aap-store-cnpg = { path = "crates/store-cnpg" }
aap-objects-kubernetes = { path = "crates/objects-kubernetes" }
aap-auth-oidc = { path = "crates/auth-oidc" }
aap-registry = { path = "crates/registry" }
aap-controller = { path = "crates/controller" }
aap-platform-api = { path = "crates/platform-api" }
anyhow = "1"
aws-lc-rs = "1.15"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = { version = "0.3", default-features = false, features = ["std", "async-await"] }
# One crypto library for JWS, `aws-lc-rs`, as the system's orchestrator has (jsonwebtoken has no `ring` backend);
# TLS stays rustls with ring (kube), which is why reqwest is 0.12: 0.13's `rustls` feature is aws-lc-rs.
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
k8s-openapi = { version = "0.28.0", default-features = false, features = ["v1_32", "schemars"] }
kube = { version = "4.0.0", default-features = false, features = ["derive"] }
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", default-features = false }
# `util` (`service_fn`, `ServiceExt::oneshot`) is what tests drive a router and a fake API server with; a crate that uses it
# names the feature.
tower = { version = "0.5", default-features = false }
# Only the CORS layer of the Platform API (D7a): the origin check is tower-http's, the list of origins is ours.
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
tracing = "0.1"
url = "2"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi"] }

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
