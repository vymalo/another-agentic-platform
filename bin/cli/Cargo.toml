[package]
name = "aap-cli"
description = "aapctl: the platform's command line. Phase 1 works offline: `validate` and `render` read AgentService, AgentConfig, ModelEndpoint and ToolProvider files and say what the operator would make of them, with no cluster and no network"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "aap_cli"
path = "src/lib.rs"

[[bin]]
name = "aapctl"
path = "src/main.rs"

[dependencies]
aap-api.workspace = true
aap-domain.workspace = true
aap-forms.workspace = true
aap-platform-client.workspace = true
aap-ports.workspace = true
aap-runtime-kubernetes.workspace = true
base64.workspace = true
clap.workspace = true
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
# `current_thread`, the timers and the loopback listener of `login`: the network commands block on one runtime and phase 1's `run` stays synchronous.
tokio = { workspace = true, features = ["rt", "time", "net", "io-util", "sync"] }
url.workspace = true

[dev-dependencies]
# The issuer the sign-in is tried against (`TestIdp`: discovery, JWKS, `/authorize`, `/token`, `/revoke`) and the authenticator that reads its
# tokens, as the Platform API's own router tests use them. Test builds only: `aapctl` itself has no JWS library.
aap-auth-oidc = { workspace = true, features = ["testkit"] }
# The tests run the built binary against the real router of the Platform API over the `Memory` ports on a loopback socket.
aap-platform-api.workspace = true
aap-ports = { workspace = true, features = ["testkit"] }
axum.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
