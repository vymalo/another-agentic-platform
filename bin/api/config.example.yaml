# The configuration of the Platform API (§60a, slice D7a): one file, read at start (`--config`, `/etc/aap-api/config.yaml`).
# **Everything is here** (ANR-970): the three ports, the log's filter and the traces. The binary reads no `API_*` variable and no
# `RUST_LOG`, and the chart gives it nothing but this file.
# A typo is an error and stops the API (an unknown key is refused), and so is anything the API could not work with.
#
# THERE IS NO SECRET IN THIS FILE, and there is no place for one. The API checks a bearer token against the keys of the
# issuer (public), and reaches the cluster with its ServiceAccount. A secret in an agent is a reference to a Secret key,
# chosen among the keys the cluster offers (`defaults.offerLabel`).

# The shape of this file. 1 is the only one there is; absent, it is 1.
version: 1

# Where the API listens, where /healthz and /readyz are served, and where /metrics is (Prometheus text, no authentication, never on
# the API's port). Three ports, all different (--check refuses a clash). /metrics is on the loopback by default, reachable from
# nothing else: say 0.0.0.0:<port> to let a scraper in. There is no flag and no variable for them (ANR-970).
listen: 0.0.0.0:8080
healthListen: 0.0.0.0:8081
metricsListen: 127.0.0.1:9090

# Whose tokens are accepted (aap-auth-oidc). The values of the roles claim are the person's permissions; the API checks
# the permissions of AD-032 one by one and never compares a role name, so no role is listed here.
oidc:
  issuer: https://keycloak.example.com/realms/another-agentic
  audiences: [another-agentic]
  rolesClaim: agentic_roles
  # jwksUrl: https://keycloak.example.com/realms/another-agentic/protocol/openid-connect/certs   # when not in the discovery document

# The origins a browser may call the API from (the web as a single-page app, the native shells). Exact origins as a browser
# writes them: scheme://host[:port], lower case, no path. No wildcard (refused), no credentials. Empty: no CORS.
cors:
  allowedOrigins:
    - https://agents.example.com
    - tauri://localhost

# The workload listener (ANR-1011, AD-068): mutual TLS, for a service that calls the API with a certificate and not a token (the
# orchestrator). OFF unless both keys below are present, and then it is a fourth port of its own: the person's listener above reads a
# bearer token and never a certificate, this one reads a certificate and never a token, and neither falls back to the other. It serves
# ONLY the owner routes (/v1/owners/{owner}/agents...); every other path is a 404. The three files are mounted by the deployment: the
# server certificate and key the API presents (re-read when the file changes), and the CA bundle client certificates must chain to
# (the one trust: re-read when it changes). Each workload is its certificate's exact URI SAN, and only `platform:agents.own` and `platform:agents.read.owner` are grantable.
# A client certificate is always required: a peer with none does not complete the handshake. Both files that hold the trust are re-read
# when they change (the server certificate and key, and the CA bundle): a renewal or a rotation needs no restart.
# workloadListener:
#   listen: 0.0.0.0:8443
#   certFile: /etc/aap-api-workload/tls/tls.crt
#   keyFile: /etc/aap-api-workload/tls/tls.key
#   clientCaFile: /etc/aap-api-workload/ca/ca.crt
# workloadClients:
#   - spiffeId: spiffe://another/ns/another-agents/sa/orchestrator
#     permissions: [platform:agents.own, platform:agents.read.owner]
#   - spiffeId: spiffe://another/ns/another-agents/sa/staff
#     permissions: [platform:agents.read.owner]

# What every new agent gets besides what its form sets (§60a, "Deployment defaults"); shown read-only on each form
# (GET /v1/info). `namespace` is the one namespace the API reads and writes.
defaults:
  namespace: another-agentic-system
  offerLabel: agents.vymalo.com/offer
  # Where a new agent's ledger lives: store.cnpg (an operator-owned CloudNativePG cluster per agent) or
  # store.secretRef ({ name: "{name}-db-app", key: uri }: a Secret per agent, named from the agent's name).
  store:
    cnpg:
      instances: 1
      storage:
        size: 5Gi
  # The size classes of the operator's run pods (the keys of its chart's `runPodClasses`; the chart writes this list itself when it has
  # run pods on, D15a): what GET /v1/info offers as `runPodSizeClasses` and what a coder form may pick. Absent or empty: this deployment
  # has no run pods, and a form that asks for them is refused. When it names a class, `coder.workVolume` below is required (run pods
  # mount it) and the API checks, at start, that a coder asking for the first class is a valid one.
  # runPodSizeClasses: [standard]
  # The Secret key that must hold the orchestrator's AGENT_REGISTRY_AGENT_TOKEN, or the orchestrator lists an agent and
  # cannot call it.
  a2aBearer:
    name: agent-a2a-bearer
    key: AGENT_REGISTRY_AGENT_TOKEN
  allowFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: another-agentic-system
  security:
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
  coder:
    gitAuthor:
      name: bored-giant-panda[bot]
      email: 337696346+bored-giant-panda[bot]@users.noreply.github.com
    allowedRepoHosts: [github.com]
    githubApiUrl: https://api.github.com
    githubMcp:
      sidecar: true
      port: 8082
    workVolume:
      name: work
      scope: agent
      mountPath: /work
      source:
        persistent:
          size: 20Gi
          storageClass: longhorn
          perReplica: true
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
  folder:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  # An image that serves A2A itself (K11b) gets the same, and nothing else: the platform gives it no model and no tools.
  a2a:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
  # The registries an agent may pin its own image from. REQUIRED, and at least one: a person who may write agents can name a
  # folder agent's own image, and the pod of that image is handed the model endpoint's API key and the A2A bearer. An entry is
  # a registry host (and port, when it has one) and does not bound repositories: ghcr.io admits every image on ghcr.io, so
  # name only registries whose images you trust. A tag or a digest is always required.
  allowedImageRegistries: [ghcr.io]

# The log. `filter` is a `tracing` filter, `info` when absent; it is what `RUST_LOG` used to be, and the binary reads no
# variable of that name (ANR-970).
log:
  filter: info

# Traces (K5, §48a): the OTLP/HTTP JSON exporter's settings, as the `OTEL_*` variables used to say them. Absent or empty: no span
# is made. The API makes one SERVER span per request, named by its route template, and no subject, agent name, body, header,
# query or token is in any of them; no inbound `traceparent` is read. A header is a **reference** (`{ file: … }`), never a value,
# and needs an `https` endpoint.
# telemetry:
#   otlp:
#     endpoint: https://collector.example.com:4318/v1/traces
#     sampler: traceidratio
#     samplerRatio: 0.25
#     headers:
#       authorization:
#         file: /var/run/secrets/aap/otel/headers
#     certificate: /etc/aap/otel/ca/ca.pem
#     resourceAttributes:
#       deployment.environment.name: prod
