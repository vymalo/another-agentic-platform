[package]
name = "aap-operator"
description = "The another-agentic-platform operator: the composition root (AD-020). `run` composes the Kubernetes runtime provider, the Secret store and the controllers; `crdgen` prints the CRDs"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "operator"
path = "src/main.rs"

[features]
# What `run` can compose (§59a lists `runtime-kubernetes`, `store-cnpg` and `registry`). Without a runtime
# provider the binary still has `crdgen` and `run` says what is missing. Without `store-cnpg` the store is
# the referenced-Secret one alone, and a service that asks for a cluster is `StoreReady: False`, reason
# `CNPGNotInstalled`. Without `registry` nothing is served on 8080 and `Listed` says `RegistryDisabled`.
default = ["runtime-kubernetes", "store-cnpg", "registry"]
runtime-kubernetes = ["dep:aap-runtime-kubernetes"]
store-cnpg = ["dep:aap-store-cnpg"]
registry = ["dep:aap-registry"]

[dependencies]
aap-api.workspace = true
aap-controller.workspace = true
aap-registry = { workspace = true, optional = true }
aap-runtime-kubernetes = { workspace = true, optional = true }
aap-store-cnpg = { workspace = true, optional = true }
aap-store-secret.workspace = true
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }
serde_yaml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
aap-domain.workspace = true
aap-ports.workspace = true
http = "1"
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
