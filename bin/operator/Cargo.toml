[package]
name = "aap-operator"
description = "The another-agentic-platform operator: the composition root (AD-020). `run` composes the Kubernetes runtime provider, the Secret store and the controllers; `crdgen` prints the CRDs"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "operator"
path = "src/main.rs"

[features]
# What `run` can compose (§59a lists `runtime-kubernetes`, `store-cnpg` and `registry`; the last two
# arrive with S6 and S7). Without a runtime provider the binary still has `crdgen` and `run` says what
# is missing.
default = ["runtime-kubernetes"]
runtime-kubernetes = ["dep:aap-runtime-kubernetes"]

[dependencies]
aap-api.workspace = true
aap-controller.workspace = true
aap-runtime-kubernetes = { workspace = true, optional = true }
aap-store-secret.workspace = true
anyhow.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap.workspace = true
kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }
serde_yaml.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
aap-domain.workspace = true
aap-ports.workspace = true
http = "1"
k8s-openapi.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
