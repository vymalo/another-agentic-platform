name: Operator

# The Rust workspace of the v0 operator (§59a): fmt, clippy, tests, the check that the CRDs
# checked in under deploy/crds are what `operator crdgen` prints, and a kind cluster that
# applies the CRDs, the examples (accepted) and examples/invalid (each refused).
#
# The `runtime-kubernetes` job runs the provider of S4 against a real API server: the conformance suite of
# aap-ports and the cases of crates/runtime-kubernetes/tests/cluster.rs, with skipping forbidden.
#
# The `operator-e2e` job is S5's end-to-end: the CRDs of deploy/crds are installed in a kind cluster, the
# `operator` binary built in the job runs against it (bin/operator/tests/cluster.rs starts it, one per case),
# and each case applies an AgentConfig and an AgentService, waits for Ready, and deletes. The pods run a stand-in
# image (bin/operator/tests/stub), so no adam image is needed.
#
# Later slices add the image, the chart and the end-to-end of the agents (S8, S9).

on:
  pull_request:
    paths:
      - "crates/**"
      - "bin/**"
      - "Cargo.*"
      - "deploy/crds/**"
      - "examples/**"
      - ".github/workflows/operator.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "bin/**"
      - "Cargo.*"
      - "deploy/crds/**"
      - "examples/**"
      - ".github/workflows/operator.yml"

permissions:
  contents: read

concurrency:
  group: operator-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Keep equal to the toolchain the workspace was written against (`rust-version` in Cargo.toml is the floor).
  RUST_TOOLCHAIN: "1.94.1"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component rustfmt --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --component clippy --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  crds-drift:
    # deploy/crds/agents.vymalo.com.yaml must be exactly what `crdgen` prints.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: crdgen output equals the checked-in CRDs
        run: |
          cargo run --locked -q -p aap-operator -- crdgen > "$RUNNER_TEMP/crds.yaml"
          if ! diff -u deploy/crds/agents.vymalo.com.yaml "$RUNNER_TEMP/crds.yaml"; then
            echo "::error file=deploy/crds/agents.vymalo.com.yaml::stale. Run: cargo run -q -p aap-operator -- crdgen > deploy/crds/agents.vymalo.com.yaml"
            exit 1
          fi

  kind:
    # The CEL rules and the schema against a real API server. The CRDs and examples are files, so
    # this job needs no Rust.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # Kubernetes v1.35.8; the digest is the index of the tag, read from Docker Hub on 2026-10-05.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: aap
          wait: 120s
      - name: Apply the CRDs
        run: |
          # Server-side: a client-side apply keeps the manifest in an annotation, which has a size limit.
          kubectl apply --server-side -f deploy/crds/agents.vymalo.com.yaml
          kubectl wait --for=condition=Established --timeout=60s \
            crd/agentconfigs.agents.vymalo.com crd/agentservices.agents.vymalo.com
          kubectl create namespace another-agentic-system
      - name: The examples are accepted
        run: |
          for f in examples/*.yaml; do
            echo "::group::apply $f"
            kubectl apply -f "$f"
            echo "::endgroup::"
          done
          kubectl -n another-agentic-system get agentservices,agentconfigs
          # Defaulting works: `chat` leaves these out.
          test "$(kubectl -n another-agentic-system get agentservice chat -o jsonpath='{.spec.deletionPolicy}')" = Retain
          test "$(kubectl -n another-agentic-system get agentservice chat -o jsonpath='{.spec.interfaces.mcp.enabled}')" = false
      - name: Each invalid example is refused, for the reason it states
        run: |
          failed=0
          for f in examples/invalid/*.yaml; do
            expect=$(sed -n 's/^# expect: //p' "$f")
            if [ -z "$expect" ]; then echo "::error file=$f::no '# expect:' line"; failed=1; continue; fi
            if out=$(kubectl apply -f "$f" 2>&1); then
              echo "::error file=$f::was accepted: $out"; failed=1
            elif ! printf '%s' "$out" | grep -qF -- "$expect"; then
              echo "::error file=$f::refused, but not for '$expect': $out"; failed=1
            else
              echo "refused as expected: $f"
            fi
          done
          exit "$failed"

  runtime-kubernetes:
    # RuntimeProvider on native Kubernetes against a real API server (S4): the conformance suite of
    # aap-ports and the cases only a cluster shows. Nothing may skip: with the two REQUIRE variables an
    # unset cluster is a failure, not a green run that proved nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same node image as the `kind` job: Kubernetes v1.35.8, the digest of the index of the tag.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: aap-runtime
          wait: 120s
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: The provider against the cluster
        env:
          AAP_TEST_REQUIRE_CLUSTER: "1"
          AAP_TEST_REQUIRE_BACKEND: "1"
        run: |
          # The kubeconfig kind-action wrote; a file, so the tests never fall back to some default context.
          export AAP_TEST_KUBECONFIG="$HOME/.kube/config"
          kubectl --kubeconfig "$AAP_TEST_KUBECONFIG" get nodes
          cargo test -p aap-runtime-kubernetes --test cluster --locked -- --test-threads=4
      - name: What the cluster says, when a case failed
        if: failure()
        run: |
          kubectl -n aap-test get statefulsets,deployments,services,networkpolicies,pdb,configmaps,pvc,pods -o wide || true
          kubectl -n aap-test get events --sort-by=.lastTimestamp | tail -80 || true
          kubectl -n aap-test describe pods | tail -200 || true

  operator-e2e:
    # The operator binary against a real cluster, with real pods (S5). Nothing may skip: with
    # AAP_TEST_REQUIRE_CLUSTER an unset cluster is a failure, not a green run that proved nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same node image as the other jobs: Kubernetes v1.35.8, the digest of the index of the tag.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: aap-operator
          wait: 120s
      - name: Install the CRDs
        run: |
          # The checked-in file, as a deployment installs it. Server-side: a client-side apply keeps the
          # manifest in an annotation, which has a size limit.
          kubectl apply --server-side -f deploy/crds/agents.vymalo.com.yaml
          kubectl wait --for=condition=Established --timeout=60s \
            crd/agentconfigs.agents.vymalo.com crd/agentservices.agents.vymalo.com
      - name: Build the stand-in for the adam image and load it into kind
        run: |
          # busybox pinned by digest that answers /healthz on 8080 as adam-agent and adam-coder would.
          docker build -t aap-stub:ci bin/operator/tests/stub
          kind load docker-image aap-stub:ci --name aap-operator
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      - name: Build the operator
        run: cargo build --locked -p aap-operator
      - name: The operator against the cluster
        env:
          AAP_TEST_REQUIRE_CLUSTER: "1"
          AAP_TEST_STUB_IMAGE: aap-stub:ci
        run: |
          # The kubeconfig kind-action wrote; a file, so the tests never fall back to some default context.
          export AAP_TEST_KUBECONFIG="$HOME/.kube/config"
          kubectl --kubeconfig "$AAP_TEST_KUBECONFIG" get nodes
          # Every case has a namespace, Secrets and object names of its own, so they run side by side.
          cargo test -p aap-operator --test cluster --locked -- --test-threads=4
      - name: What the cluster says, when a case failed
        if: failure()
        run: |
          kubectl get agentservices,agentconfigs -A -o yaml | tail -400 || true
          kubectl get deployments,statefulsets,services,pvc,pods -A -o wide | grep aap-e2e || true
          kubectl get events -A --sort-by=.lastTimestamp | tail -80 || true
          for f in /tmp/aap-e2e-*.log; do echo "== $f"; tail -60 "$f"; done || true
