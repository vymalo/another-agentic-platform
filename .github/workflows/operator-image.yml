      - name: A folder agent calls the catalogue's Kubernetes server through a ToolProvider
        env:
          OPERATOR_IMAGE_REPOSITORY: operator
          OPERATOR_IMAGE_TAG: smoke
          OPERATOR_PULL_POLICY: Never
        run: sh deploy/operator/tests/e2e/k10-e2e.sh

  namespaces-e2e:
