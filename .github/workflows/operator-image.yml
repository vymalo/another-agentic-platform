name: Operator and API images

# The images and the chart of the platform (S8, S9, D7b1, D7b2): checks on pull requests, the images on main, and a tag bump in the chart. Two
# images are built from one commit, `operator` (S8) and `api` (the Platform API, D7b1), and ONE job bumps both tags in one commit: two
# workflows would each push a bump to main and race (and each one's "has main moved on?" test would count the other's bump commit as a
# newer build). The cost is that the api image waits for the operator's end-to-end and that both tags always move together; the images
# are built from one Cargo workspace, so a change to a shared crate moves both anyway. The Rust checks (fmt, clippy, tests, the CRD drift
# check, the kind jobs of the crates) are operator.yml's; this workflow covers what only the images and the charts show. The pattern of
# vymalo/another-adam-rs coder.yml and vymalo/another-agentic-system orchestrator.yml.
#
# chart:       helm lint of both charts, the render checks of deploy/operator (goldens, RBAC, refusals, the CRDs chart against
#              deploy/crds, the API's Role against the objects crate's rbac.yaml), and kubeconform in strict mode over the renders,
#              the Platform API's included.
# scripts:     shellcheck, and bump-tag.sh is idempotent and edits only the tag it was asked for (image.tag, or api.image.tag).
# dockerfile:  hadolint (the operator's Dockerfile, and in dockerfile-api the API's).
# image:       builds the image on pull requests too (no push) and smoke-tests it: the user, the binary starts, `crdgen` prints the
#              checked-in CRDs, `run` without a cluster says so, and there is no shell. The image is kept as an artifact: the jobs
#              that follow use THE image that passed, never a rebuild of it.
# api-image:   (D7b1) builds docker/api/Dockerfile and smoke-tests the image like the operator's (the user, the version, the usage, the
#              example configuration accepted, a misspelt key refused, no cluster to reach said so, no shell), and runs `api --check`
#              in the image on the configuration the chart renders for each shape of values it is tested in (deploy/operator/tests/
#              api-shapes.sh: the golden one, a Secret per agent, the least a deployment must say, and one that sets every value). That
#              finds a shape the chart renders and the binary refuses; it does not prove there is none: the chart refuses what it can check
#              at render time, and anything else the binary refuses at start, failing closed. It is kept as an artifact for the push, as
#              the operator's is.
# operator-coder-e2e (S9): a kind cluster, the CRDs chart and the operator chart installed with THAT image, the real adam-rs coder
#              image (ghcr.io/vymalo/another-adam-rs/coder, by tag and digest, 2.9 GB) run by the operator on a Postgres the job runs
#              and dummy Secrets: the AgentService becomes Ready, the agent card answers through the Service, the registry lists the
#              coder, and a deletion completes its finalizer and keeps the claim (Retain). deploy/operator/tests/e2e/README.md says
#              what it proves and what it does not (no model, no GitHub).
# api-e2e (D7b2): a kind cluster, the CRDs chart and the operator chart installed with the operator AND the API image that passed
#              (`api.enabled`), the stand-in for the adam image (bin/operator/tests/stub) as the agent's image, and the testkit's issuer
#              (crates/auth-oidc/examples/test-issuer.rs, built in the job) running on the runner, where the API pod fetches its keys and
#              the script gets tokens. The script drives the DEPLOYED API through a port-forward: 401/403, a model by reference to an
#              offered Secret key, a folder agent created with the preconditions (428, 422, 201, 409), the operator making it Ready, the
#              listing, the detail, the YAML, a replace and a delete with their ETags (200, 412), the finalizer completing; and no
#              secret value in any answer or log. It lives HERE and not in operator.yml because both images are artifacts of this
#              workflow already (the push uses them), and `push` needs it: no API image is pushed that failed its end-to-end, and no
#              second workflow races the one bump. deploy/operator/tests/e2e/README.md says what it proves and what it does not.
# chain-e2e (D13): the whole chain in a kind cluster of its own. The CRDs chart and the operator chart installed with the operator AND the
#              API image that passed, the registry on, the stand-in for the adam image (bin/operator/tests/stub, whose card is a full A2A
#              1.0 card) as the agent's image, one testkit issuer on the runner for the API and for the orchestrator, and THE SYSTEM'S
#              ORCHESTRATOR, a published image of another repository pinned by tag and digest in one file
#              (deploy/operator/tests/e2e/chain-orchestrator.yaml), with a Postgres. The script makes a coder with an audience through the
#              deployed API, the operator runs it and lists it in its registry, and the orchestrator lists it for the person who holds the role
#              and for nobody else: alice (the role), bob (another agent's role: [], the registry ok, the capabilities of an agent that does
#              not exist), admin (listed: the pinned system's ADR 0045, decision 1.4, which the registry contract does not share: an open
#              question for the owner), carol (the audience's value alone: 403 no_access); then the coder is deleted and the listing empties.
#              It runs in parallel with api-e2e and **does not gate the push**: it pulls two third-party images (ghcr.io, mirror.gcr.io) into
#              kind and reads a pin this repository does not control, so a flake or a bad pin of the system's would block the operator's
#              release for a reason that is not the operator's. That is a decision for the owner (§60a, D13): to make it gate, add it to
#              the `needs` of `push` below. deploy/operator/tests/e2e/README.md says what it proves and what it does not.
# push:        main only, after every job above but chain-e2e: `sha-<7>` and `latest` of both images (the same tag). One red job of either
#              image (the API's included) means no image is pushed and no tag bumped: a decision for the owner (deploy/operator/README.md,
#              "The image").
# bump:        main only, after the push: `deploy/operator/bump-tag.sh` sets `image.tag` and, with `api`, `api.image.tag` in
#              deploy/operator/values.yaml and `chore(deploy): bump operator and api to sha-<7>` is pushed to main as
#              github-actions[bot] (decided in §93, 2026-10-05).
#              It is made with GITHUB_TOKEN, which does not trigger workflows, so it cannot loop; Argo CD in home-os tracks this
#              repository and rolls the new tag out (S10). It is a no-op when the tag is current, and it does not put an older
#              tag back when a newer commit has moved main (jobs can finish out of order).
#
# The governance and commit-lint workflows run on pull requests only (governance.yml, commit-lint.yml: `on: pull_request`),
# so a push to main, the bump included, is checked by neither; the subject of the bump passes tools/commit-lint.sh anyway.
# Whether main accepts a push from github-actions is *unverified* for this repository (no branch protection could be read, and the
# repository has no ruleset: `gh api repos/vymalo/another-agentic-platform/rulesets` answered []): the first bump says. Pull requests
# get a dry run that shows the edit the bump would make.

on:
  pull_request:
    paths:
      - "crates/**"
      - "bin/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/operator/**"
      - "docker/api/**"
      - "deploy/operator/**"
      - "deploy/operator-crds/**"
      - "deploy/crds/**"
      - ".github/workflows/operator-image.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "bin/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docker/operator/**"
      - "docker/api/**"
      - "deploy/operator/**"
      - "deploy/operator-crds/**"
      - "deploy/crds/**"
      - ".github/workflows/operator-image.yml"

env:
  IMAGE: ghcr.io/vymalo/another-agentic-platform/operator
  API_IMAGE: ghcr.io/vymalo/another-agentic-platform/api
  HELM_VERSION: v3.19.0
  KUBECONFORM_VERSION: v0.7.0
  # The Kubernetes version the rendered manifests are validated against.
  KUBERNETES_VERSION: 1.31.0

concurrency:
  group: operator-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  chart:
    name: helm lint, render checks and kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: helm lint
        run: |
          helm lint deploy/operator
          helm lint deploy/operator -f deploy/operator/examples/netcup.values.yaml
          helm lint deploy/operator -f deploy/operator/tests/secret.values.yaml
          helm lint deploy/operator -f deploy/operator/tests/api.values.yaml
          # tests/api-secretref.values.yaml is NOT linted: it says `cnpg: null` (to switch the store to a Secret per agent), and `helm lint`
          # coalesces the values twice, so the second pass puts the chart's default `cnpg` back and logs ten "[INFO] Fail: ... exactly
          # one of cnpg and secretRef" that fail nothing (reproduced with a four-line chart, helm v3.19.0: a key set to null in the values
          # file comes back from the chart's defaults under `lint` and not under `template`). `helm template`, which is what Argo CD and
          # install run, deletes the key; render-check.sh, `api --check` and kubeconform read this shape, and that is its guard.
          helm lint deploy/operator -f deploy/operator/tests/api-full.values.yaml
          helm lint deploy/operator-crds
      - name: helm template (the values of the netcup Application)
        run: |
          helm template aap-operator deploy/operator --namespace another-agentic-system -f deploy/operator/examples/netcup.values.yaml > /dev/null
          helm template aap-operator deploy/operator --namespace another-agentic-system -f deploy/operator/examples/netcup.values.yaml \
            -f deploy/operator/tests/api.values.yaml > /dev/null
          helm template aap-operator-crds deploy/operator-crds > /dev/null
      - name: The rendered chart keeps its guarantees
        run: sh deploy/operator/tests/render-check.sh
      # Core kinds against the Kubernetes schemas, the ExternalSecret against the CRD schema vendored in
      # deploy/operator/tests/schemas (a pinned copy of the datreeio catalog: a live catalog 500 once skipped the image job of
      # adam-rs). A kind without a schema fails (no -ignore-missing-schemas). The core schemas are still downloaded; a
      # download failure (not a validation failure) is retried. The CRDs themselves are skipped: no schema set has one for
      # CustomResourceDefinition, and the `kind` job of operator.yml applies them to a real API server.
      - name: kubeconform
        env:
          KUBECONFORM_SHA256: c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
        run: |
          set -eu
          curl -sSfL -o "$RUNNER_TEMP/kubeconform.tgz" \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  $RUNNER_TEMP/kubeconform.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tgz" -C "$RUNNER_TEMP" kubeconform
          # The defaults (no registry), netcup (an ExternalSecret), tests/secret.values.yaml (an existing Secret, another watched
          # namespace, no CloudNativePG), the Platform API in its three shapes (tests/api.values.yaml: an Ingress and a policy;
          # tests/api-secretref.values.yaml: neither, an existing service account; tests/api-full.values.yaml: every value set), and the
          # CRDs chart.
          helm template aap-operator deploy/operator --namespace another-agentic-system > "$RUNNER_TEMP/rendered-default.yaml"
          helm template aap-operator deploy/operator --namespace another-agentic-system \
            -f deploy/operator/examples/netcup.values.yaml > "$RUNNER_TEMP/rendered-netcup.yaml"
          helm template aap-operator deploy/operator --namespace another-agentic-system \
            -f deploy/operator/tests/secret.values.yaml > "$RUNNER_TEMP/rendered-secret.yaml"
          helm template aap-operator deploy/operator --namespace another-agentic-system \
            -f deploy/operator/tests/api.values.yaml > "$RUNNER_TEMP/rendered-api.yaml"
          helm template aap-operator deploy/operator --namespace another-agentic-system \
            -f deploy/operator/tests/api-secretref.values.yaml > "$RUNNER_TEMP/rendered-api-secretref.yaml"
          helm template aap-operator deploy/operator --namespace another-agentic-system \
            -f deploy/operator/tests/api-full.values.yaml > "$RUNNER_TEMP/rendered-api-full.yaml"
          helm template aap-operator-crds deploy/operator-crds > "$RUNNER_TEMP/rendered-crds.yaml"
          for attempt in 1 2 3; do
            status=0
            "$RUNNER_TEMP/kubeconform" -strict -summary -skip CustomResourceDefinition -kubernetes-version "$KUBERNETES_VERSION" \
                -schema-location default \
                -schema-location 'deploy/operator/tests/schemas/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                "$RUNNER_TEMP/rendered-default.yaml" "$RUNNER_TEMP/rendered-netcup.yaml" "$RUNNER_TEMP/rendered-secret.yaml" \
                "$RUNNER_TEMP/rendered-api.yaml" "$RUNNER_TEMP/rendered-api-secretref.yaml" "$RUNNER_TEMP/rendered-api-full.yaml" \
                "$RUNNER_TEMP/rendered-crds.yaml" \
                > "$RUNNER_TEMP/kubeconform.out" 2>&1 || status=$?
            cat "$RUNNER_TEMP/kubeconform.out"
            if [ "$status" -eq 0 ]; then exit 0; fi
            if ! grep -q 'failed downloading schema' "$RUNNER_TEMP/kubeconform.out"; then exit "$status"; fi
            echo "schema download failed (attempt $attempt of 3); retrying in 20 s"
            sleep 20
          done
          exit 1

  dockerfile:
    name: lint Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/operator/Dockerfile

  dockerfile-api:
    name: lint the API's Dockerfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/api/Dockerfile

  scripts:
    name: shell scripts and the bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck deploy/operator/bump-tag.sh deploy/operator/tests/*.sh deploy/operator/tests/e2e/*.sh
      - name: bump-tag.sh is idempotent and edits only the tag it was asked for (image.tag, or api.image.tag)
        run: sh deploy/operator/tests/bump-tag-test.sh

  bump-dry-run:
    name: show the tag bump
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: What the bump would change on main
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          sh deploy/operator/bump-tag.sh deploy/operator/values.yaml "$tag" operator
          sh deploy/operator/bump-tag.sh deploy/operator/values.yaml "$tag" api
          {
            echo "### Tag bump dry run"
            echo
            echo "On main this pull request would set \`image.tag\` and \`api.image.tag\` to \`$tag\`:"
            echo
            echo '```diff'
            git diff --unified=1 -- deploy/operator/values.yaml
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    name: build and smoke-test the image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Built here, once, and loaded into the local daemon: the smoke test below and the jobs after this one run what is pushed.
      # Fork pull requests cannot write the cache: ignore-error keeps them green.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/operator/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: operator:smoke
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=operator
          cache-to: type=gha,mode=max,scope=operator,ignore-error=true
      - name: Smoke test the image
        run: |
          set -euo pipefail
          # Numeric, so Kubernetes can verify runAsNonRoot: the chart's runAsUser is the same number.
          user=$(docker inspect -f '{{.Config.User}}' operator:smoke)
          [ "$user" = 65532:65532 ] || { echo "::error::image user is '$user', expected 65532:65532"; exit 1; }
          # The binary starts as that user, and says what it does.
          # (Read whole first: `docker run | grep -q` under pipefail fails when grep exits on its match while docker still writes.)
          help=$(docker run --rm operator:smoke --help)
          grep -q crdgen <<<"$help"
          run_help=$(docker run --rm operator:smoke run --help)
          grep -q REGISTRY_TOKEN_FILE <<<"$run_help"
          # `crdgen` prints the CRDs of the repository, byte for byte: the image's binary is this commit's.
          docker run --rm operator:smoke crdgen > "$RUNNER_TEMP/crds.yaml"
          cmp "$RUNNER_TEMP/crds.yaml" deploy/crds/agents.vymalo.com.yaml
          cmp "$RUNNER_TEMP/crds.yaml" deploy/operator-crds/files/agents.vymalo.com.yaml
          # `run` with no cluster to reach fails, and says so (never a panic, never a hang).
          out=$(docker run --rm -e KUBECONFIG=/nonexistent operator:smoke run 2>&1) && { echo "::error::run succeeded with no cluster"; exit 1; } || true
          grep -q 'connecting to the cluster' <<<"$out" || { echo "::error::run did not say it was connecting: $out"; exit 1; }
          # Only the operator: no shell, no package manager in the image (a read of the whole file system).
          cid=$(docker create operator:smoke)
          files=$(docker export "$cid" | tar -t)
          docker rm "$cid" > /dev/null
          grep -qx 'operator' <<<"$files" || { echo "::error::no /operator in the image"; exit 1; }
          if grep -Eq '(^|/)s?bin/(sh|bash|dash|busybox|apt|apt-get|dpkg)$' <<<"$files"; then
            echo "::error::the image has a shell or a package manager"; grep -E '(^|/)s?bin/(sh|bash|dash|busybox|apt|apt-get|dpkg)$' <<<"$files"; exit 1
          fi
          size=$(docker image inspect -f '{{.Size}}' operator:smoke)
          echo "image size: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      # The image that passed travels to the jobs after this one as a file.
      - name: Save the image
        run: docker save operator:smoke -o "$RUNNER_TEMP/operator.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: operator-image
          path: ${{ runner.temp }}/operator.tar
          retention-days: 1
          if-no-files-found: error

  api-image:
    name: build and smoke-test the API image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      # Built here, once, and loaded into the local daemon: the smoke test below and the push after it run what was tested.
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/api/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: api:smoke
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api,ignore-error=true
      - name: Smoke test the image
        run: |
          set -euo pipefail
          # Numeric, so Kubernetes can verify runAsNonRoot: the chart's runAsUser is the same number.
          user=$(docker inspect -f '{{.Config.User}}' api:smoke)
          [ "$user" = 65532:65532 ] || { echo "::error::image user is '$user', expected 65532:65532"; exit 1; }
          # The binary starts as that user, says its version and its usage. (Read whole first: `docker run | grep -q` under pipefail
          # fails when grep exits on its match while docker still writes.)
          version=$(docker run --rm api:smoke --version)
          grep -q '^api ' <<<"$version" || { echo "::error::--version said: $version"; exit 1; }
          help=$(docker run --rm api:smoke --help)
          grep -q -e '--check' <<<"$help"
          grep -q API_CONFIG_FILE <<<"$help"
          # No configuration, no API: the file is required.
          if docker run --rm api:smoke > /dev/null 2>&1; then echo "::error::the API started with no configuration file"; exit 1; fi
          # The example configuration is one the API can work with, and `--check` needs no cluster and no issuer.
          out=$(docker run --rm -v "$PWD/bin/api:/cfg:ro" api:smoke --config /cfg/config.example.yaml --check)
          grep -q ': ok$' <<<"$out" || { echo "::error::--check said: $out"; exit 1; }
          # A misspelt key is refused, by name (the types deny unknown fields at every level).
          bad="$RUNNER_TEMP/api-bad"; mkdir -p "$bad"
          { cat bin/api/config.example.yaml; printf '\nlistn: 0.0.0.0:8080\n'; } > "$bad/config.yaml"
          out=$(docker run --rm -v "$bad:/cfg:ro" api:smoke --config /cfg/config.yaml --check 2>&1) && { echo "::error::a misspelt key was accepted"; exit 1; } || true
          grep -q listn <<<"$out" || { echo "::error::the refusal did not name the key: $out"; exit 1; }
          # With a good file and no cluster to reach, serving fails, and says so (never a panic, never a hang).
          out=$(docker run --rm -e KUBECONFIG=/nonexistent -v "$PWD/bin/api:/cfg:ro" api:smoke --config /cfg/config.example.yaml 2>&1) && { echo "::error::the API served with no cluster"; exit 1; } || true
          grep -q 'connecting to the cluster' <<<"$out" || { echo "::error::the API did not say it was connecting: $out"; exit 1; }
          # Only the API: no shell, no package manager in the image (a read of the whole file system).
          cid=$(docker create api:smoke)
          files=$(docker export "$cid" | tar -t)
          docker rm "$cid" > /dev/null
          grep -qx 'api' <<<"$files" || { echo "::error::no /api in the image"; exit 1; }
          if grep -Eq '(^|/)s?bin/(sh|bash|dash|busybox|apt|apt-get|dpkg)$' <<<"$files"; then
            echo "::error::the image has a shell or a package manager"; grep -E '(^|/)s?bin/(sh|bash|dash|busybox|apt|apt-get|dpkg)$' <<<"$files"; exit 1
          fi
          size=$(docker image inspect -f '{{.Size}}' api:smoke)
          echo "api image size: $size bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      # The image's own `--check` on what `helm template` renders for each shape the chart is tested in (tests/api-shapes.sh: the golden one,
      # the Secret-per-agent one, the least a deployment must say, and one that sets every value the chart exposes). The chart refuses what
      # it can check at render time; what it cannot, the binary refuses at start (a pod that never becomes ready), and this is where a shape
      # the chart renders and the binary refuses is found, before it is deployed.
      - name: The configuration the chart renders is one the image accepts
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/api-config"
          sh deploy/operator/tests/api-shapes.sh "$dir"
          for f in "$dir"/*.yaml; do
            name=$(basename "$f" .yaml)
            echo "--- $name.yaml"
            cat "$f"
            out=$(docker run --rm -v "$dir:/cfg:ro" api:smoke --config "/cfg/$name.yaml" --check)
            echo "$out"
            grep -q ': ok$' <<<"$out" || { echo "::error::the image refuses the configuration the chart renders ($name): $out"; exit 1; }
          done
      # The image that passed travels to the push as a file.
      - name: Save the image
        run: docker save api:smoke -o "$RUNNER_TEMP/api.tar"
      - uses: actions/upload-artifact@v7
        with:
          name: api-image
          path: ${{ runner.temp }}/api.tar
          retention-days: 1
          if-no-files-found: error

  operator-coder-e2e:
    name: operator-coder-e2e
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The coder image is 2.9 GB compressed and a good 8 GB on disk once kind has it: make room first.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same node image as the jobs of operator.yml: Kubernetes v1.35.8, the digest of the index of the tag.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: aap-coder
          wait: 120s
      # The image that passed the smoke test, loaded into the cluster: the chart runs it with pullPolicy Never.
      - uses: actions/download-artifact@v8
        with:
          name: operator-image
          path: ${{ runner.temp }}
      - name: Load the image into kind
        run: |
          docker load -i "$RUNNER_TEMP/operator.tar"
          kind load docker-image operator:smoke --name aap-coder
      - name: The operator runs the coder
        env:
          OPERATOR_IMAGE_REPOSITORY: operator
          OPERATOR_IMAGE_TAG: smoke
          OPERATOR_PULL_POLICY: Never
        run: sh deploy/operator/tests/e2e/coder-e2e.sh

  api-e2e:
    name: api-e2e
    needs: [image, api-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The toolchain of operator.yml, which builds the same workspace.
      RUST_TOOLCHAIN: "1.94.1"
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same node image as the other jobs: Kubernetes v1.35.8, the digest of the index of the tag.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: aap-api
          wait: 120s
      # The images that passed their smoke tests, loaded into the cluster: the chart runs them with pullPolicy Never. The agent's image is the
      # stand-in of operator.yml's operator-e2e (busybox pinned by digest that answers /healthz on 8080 as adam-agent would).
      - uses: actions/download-artifact@v8
        with:
          name: operator-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: ${{ runner.temp }}
      - name: Load the images into kind
        run: |
          docker load -i "$RUNNER_TEMP/operator.tar"
          docker load -i "$RUNNER_TEMP/api.tar"
          docker build -t aap-stub:ci bin/operator/tests/stub
          kind load docker-image operator:smoke api:smoke aap-stub:ci --name aap-api
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      # Test tooling: the testkit's issuer as a program. Nothing ships it (an example of the crate), and it is not in either image.
      - name: Build the test issuer
        run: cargo build --locked -p aap-auth-oidc --example test-issuer --features testkit
      - name: The API creates an agent, the operator makes it Ready
        env:
          OPERATOR_IMAGE_REPOSITORY: operator
          OPERATOR_IMAGE_TAG: smoke
          OPERATOR_PULL_POLICY: Never
          API_IMAGE_REPOSITORY: api
          API_IMAGE_TAG: smoke
          API_PULL_POLICY: Never
          AGENT_IMAGE: aap-stub:ci
          TEST_ISSUER_BIN: ${{ github.workspace }}/target/debug/examples/test-issuer
        run: |
          # The issuer runs on this machine, which the pods of kind reach at the IPv4 gateway of the docker network `kind`.
          AAP_TEST_HOST_ADDR="$(docker network inspect kind --format '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          test -n "$AAP_TEST_HOST_ADDR" || { echo "::error::no IPv4 gateway found for the docker network kind"; exit 1; }
          echo "pods reach this machine at $AAP_TEST_HOST_ADDR"
          export AAP_TEST_HOST_ADDR
          sh deploy/operator/tests/e2e/api-e2e.sh

  chain-e2e:
    name: chain-e2e
    needs: [image, api-image]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The toolchain of operator.yml, which builds the same workspace.
      RUST_TOOLCHAIN: "1.94.1"
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same node image as the other jobs: Kubernetes v1.35.8, the digest of the index of the tag.
          node_image: kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0
          cluster_name: aap-chain
          wait: 120s
      # The images that passed their smoke tests, loaded into the cluster: the chart runs them with pullPolicy Never. The agent's image is the
      # stand-in of operator.yml's operator-e2e. The orchestrator and Postgres are NOT loaded: the kubelet pulls them, by digest (chain-orchestrator.yaml).
      - uses: actions/download-artifact@v8
        with:
          name: operator-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: ${{ runner.temp }}
      - name: Load the images into kind
        run: |
          docker load -i "$RUNNER_TEMP/operator.tar"
          docker load -i "$RUNNER_TEMP/api.tar"
          docker build -t aap-stub:ci bin/operator/tests/stub
          kind load docker-image operator:smoke api:smoke aap-stub:ci --name aap-chain
      - name: Install Rust
        run: rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --no-self-update && rustup default "$RUST_TOOLCHAIN"
      - uses: Swatinem/rust-cache@v2
      # Test tooling: the testkit's issuer as a program. Nothing ships it (an example of the crate), and it is not in either image.
      - name: Build the test issuer
        run: cargo build --locked -p aap-auth-oidc --example test-issuer --features testkit
      - name: The API makes a coder with an audience, the operator runs it, a pinned orchestrator lists it by audience
        env:
          OPERATOR_IMAGE_REPOSITORY: operator
          OPERATOR_IMAGE_TAG: smoke
          OPERATOR_PULL_POLICY: Never
          API_IMAGE_REPOSITORY: api
          API_IMAGE_TAG: smoke
          API_PULL_POLICY: Never
          AGENT_IMAGE: aap-stub:ci
          TEST_ISSUER_BIN: ${{ github.workspace }}/target/debug/examples/test-issuer
        run: |
          # The issuer runs on this machine, which the pods of kind reach at the IPv4 gateway of the docker network `kind`.
          AAP_TEST_HOST_ADDR="$(docker network inspect kind --format '{{range .IPAM.Config}}{{println .Gateway}}{{end}}' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | head -1)"
          test -n "$AAP_TEST_HOST_ADDR" || { echo "::error::no IPv4 gateway found for the docker network kind"; exit 1; }
          echo "pods reach this machine at $AAP_TEST_HOST_ADDR"
          export AAP_TEST_HOST_ADDR
          sh deploy/operator/tests/e2e/chain-e2e.sh

  push:
    name: push the images that passed
    # Main only, and only after everything above: the chart, the Dockerfiles, the scripts, both images' own smoke tests, the coder, and the API's
    # end-to-end (no API image is pushed that failed to start in a cluster and serve its first agent). NOT chain-e2e: it runs another repository's
    # image, pinned here, and a red run of it is a reason to look, not to withhold the operator's release (an owner decision, §60a D13; to flip it,
    # add chain-e2e to this list).
    needs: [chart, dockerfile, dockerfile-api, scripts, image, api-image, operator-coder-e2e, api-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One push at a time, so the check below and the push of `latest` are not interleaved with another run's.
    concurrency:
      group: operator-push
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: operator-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: ${{ runner.temp }}
      - name: Load the images that passed
        run: |
          docker load -i "$RUNNER_TEMP/operator.tar"
          docker load -i "$RUNNER_TEMP/api.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tags: `sha-<7>` is what the chart pins (never `latest`), `latest` is for people.
      - name: Push
        run: |
          set -eu
          tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          docker tag operator:smoke "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          docker tag api:smoke "$API_IMAGE:$tag"
          docker push "$API_IMAGE:$tag"
          # `latest` follows the newest build only: image jobs can finish out of order, and an older run must not move it back
          # (the same rule as the bump below; the bump commits themselves, old subject and new, do not count).
          newer="$(git log --format=%s "$GITHUB_SHA..origin/main" -- crates bin Cargo.toml Cargo.lock docker/operator docker/api deploy/operator deploy/operator-crds deploy/crds .github/workflows/operator-image.yml | grep -Ev '^chore\(deploy\): bump (operator|operator and api) to ' || true)"
          if [ -n "$newer" ]; then
            pushed="\`$IMAGE:$tag\` and \`$API_IMAGE:$tag\` (not \`latest\`: main has moved on since this commit, the newer build pushes it)."
          else
            docker tag operator:smoke "$IMAGE:latest"
            docker push "$IMAGE:latest"
            docker tag api:smoke "$API_IMAGE:latest"
            docker push "$API_IMAGE:latest"
            pushed="\`$IMAGE:$tag\`, \`$IMAGE:latest\`, \`$API_IMAGE:$tag\` and \`$API_IMAGE:latest\`."
          fi
          {
            echo "### Pushed"
            echo
            echo "$pushed"
            echo
            echo "A new GHCR package is private until it is made public (deploy/operator/README.md, \"The image\"): the api package, the first time."
          } >> "$GITHUB_STEP_SUMMARY"

  # The images that were just pushed are the ones the chart deploys: set `image.tag` and `api.image.tag` in deploy/operator/values.yaml to
  # `sha-<first 7 of the commit>` and push `chore(deploy): bump operator and api to sha-xxxxxxx` to main as github-actions. One job, one
  # commit, one retry loop for both tags: a second workflow with a bump of its own would race this one on `git push` and, because the
  # "has main moved on?" test below reads the subjects of the commits that follow, take the other's bump for a newer build.
  bump:
    name: bump the tags in the chart
    needs: push
    runs-on: ubuntu-latest
    concurrency:
      group: operator-bump
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set image.tag and push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A newer commit that changes what this workflow builds makes its own image and bumps for itself; do not put the tag
            # back to this older one (image jobs can finish out of order). The bump commits themselves do not count.
            newer="$(git log --format=%s "$SHA..origin/main" -- crates bin Cargo.toml Cargo.lock docker/operator docker/api deploy/operator deploy/operator-crds deploy/crds .github/workflows/operator-image.yml | grep -Ev '^chore\(deploy\): bump (operator|operator and api) to ' || true)"
            if [ -n "$newer" ]; then
              echo "main has moved on since $SHA; the newer build will bump"
              exit 0
            fi
            sh deploy/operator/bump-tag.sh deploy/operator/values.yaml "$tag" operator
            sh deploy/operator/bump-tag.sh deploy/operator/values.yaml "$tag" api
            if git diff --quiet -- deploy/operator/values.yaml; then
              echo "both tags are current"
              exit 0
            fi
            git add deploy/operator/values.yaml
            git commit -m "chore(deploy): bump operator and api to $tag"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit (attempt $attempt); retrying"
            sleep $((attempt * 3))
          done
          echo "could not push the bump" >&2
          exit 1
