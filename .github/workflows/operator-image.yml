      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same node image as the other jobs: Kubernetes v1.37.0, the digest of the index of the tag. Its network plugin, kindnet, enforces
          # NetworkPolicies (the catalogue's server admits this namespace on 8080, and the operator's probe goes through its own policy).
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.2
          cluster_name: aap-k10
          wait: 120s
      # The image that passed the smoke test, loaded into the cluster: the chart runs it with pullPolicy Never. The coder's image (the agent and the
      # model), the catalogue's server and Postgres are NOT loaded: the kubelet pulls them, by digest (run-pods.yaml, examples/toolproviders and
      # k10-support.yaml).
      - uses: actions/download-artifact@v8
        with:
          name: operator-image
          path: ${{ runner.temp }}
      - name: Load the image into kind
        run: |
          docker load -i "$RUNNER_TEMP/operator.tar"
          kind load docker-image operator:smoke --name aap-k10
      - name: The node tests of the scripted model
