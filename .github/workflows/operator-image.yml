          OPERATOR_PULL_POLICY: Never
          AGENT_IMAGE: aap-stub:ci
        run: sh deploy/operator/tests/e2e/namespaces-e2e.sh

  leader-e2e:
    name: leader-e2e
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.33.0
          # The same node image as the other jobs: Kubernetes v1.37.0, the digest of the index of the tag.
          node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          kubectl_version: v1.37.2
          cluster_name: aap-leader
          wait: 120s
      # The image that passed the smoke test, loaded into the cluster: the chart runs it with pullPolicy Never. The agent's image is the
      # stand-in of operator.yml's operator-e2e (busybox pinned by digest that answers /healthz on 8080 as adam-agent would).
      - uses: actions/download-artifact@v8
        with:
          name: operator-image
          path: ${{ runner.temp }}
      - name: Load the images into kind
        run: |
          docker load -i "$RUNNER_TEMP/operator.tar"
          docker build -t aap-stub:ci bin/operator/tests/stub
          kind load docker-image operator:smoke aap-stub:ci --name aap-leader
      - name: Two replicas elect a leader, a killed one is replaced, and a stopped one releases the Lease
        env:
          OPERATOR_IMAGE_REPOSITORY: operator
          OPERATOR_IMAGE_TAG: smoke
          OPERATOR_PULL_POLICY: Never
          AGENT_IMAGE: aap-stub:ci
        run: sh deploy/operator/tests/e2e/leader-e2e.sh

  push:
    name: push the images that passed
    # Main only, and only after everything above: the chart, the Dockerfiles, the scripts, both images' own smoke tests, the coder, the API's
    # end-to-end (no API image is pushed that failed to start in a cluster and serve its first agent) and the end-to-end of several watched
    # namespaces (K6b: one Role and RoleBinding in each, no ClusterRole, an agent of each reconciled, and a shared service id listed for
    # neither) and of the leader election (K7b: two replicas, one Lease, a killed holder replaced after the lease and a stopped one
    # released at once). NOT chain-e2e and NOT run-pods-e2e: they run other repositories' images, pinned here, and a red run of either is a
    # reason to look, not to withhold the operator's release (owner decisions, §60a D13 and D15b; to flip one, add it to this list). The new
    # namespaces-e2e and leader-e2e pull only the curl image api-e2e already pulls, and nothing else outside this repository.
    needs: [chart, dockerfile, dockerfile-api, scripts, image, api-image, operator-coder-e2e, api-e2e, namespaces-e2e, leader-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # One push at a time, so the check below and the push of `latest` are not interleaved with another run's.
    concurrency:
      group: operator-push
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: operator-image
          path: ${{ runner.temp }}
      - uses: actions/download-artifact@v8
        with:
          name: api-image
          path: ${{ runner.temp }}
      - name: Load the images that passed
        run: |
          docker load -i "$RUNNER_TEMP/operator.tar"
          docker load -i "$RUNNER_TEMP/api.tar"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tags: `sha-<7>` is what the chart pins (never `latest`), `latest` is for people.
      - name: Push
        run: |
          set -eu
          tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
          docker tag operator:smoke "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          docker tag api:smoke "$API_IMAGE:$tag"
          docker push "$API_IMAGE:$tag"
          # `latest` follows the newest build only: image jobs can finish out of order, and an older run must not move it back
          # (the same rule as the bump below; the bump commits themselves, old subject and new, do not count).
          newer="$(git log --format=%s "$GITHUB_SHA..origin/main" -- crates bin Cargo.toml Cargo.lock docker/operator docker/api deploy/operator deploy/operator-crds deploy/crds .github/workflows/operator-image.yml | grep -Ev '^chore\(deploy\): bump (operator|operator and api|operator, api and usage-ingest) to ' || true)"
          if [ -n "$newer" ]; then
            pushed="\`$IMAGE:$tag\` and \`$API_IMAGE:$tag\` (not \`latest\`: main has moved on since this commit, the newer build pushes it)."
          else
            docker tag operator:smoke "$IMAGE:latest"
            docker push "$IMAGE:latest"
            docker tag api:smoke "$API_IMAGE:latest"
            docker push "$API_IMAGE:latest"
            pushed="\`$IMAGE:$tag\`, \`$IMAGE:latest\`, \`$API_IMAGE:$tag\` and \`$API_IMAGE:latest\`."
          fi
          {
            echo "### Pushed"
            echo
            echo "$pushed"
            echo
            echo "A new GHCR package is private until it is made public (deploy/operator/README.md, \"The image\"): the api package, the first time."
          } >> "$GITHUB_STEP_SUMMARY"

  # The images that were just pushed are the ones the chart deploys: set `image.tag` and `api.image.tag` in deploy/operator/values.yaml to
  # `sha-<first 7 of the commit>` and push `chore(deploy): bump operator and api to sha-xxxxxxx` to main as github-actions. One job, one
  # commit, one retry loop for both tags: a second workflow with a bump of its own would race this one on `git push` and, because the
  # "has main moved on?" test below reads the subjects of the commits that follow, take the other's bump for a newer build.
  bump:
    name: bump the tags in the chart
    needs: push
    runs-on: ubuntu-latest
    concurrency:
      group: operator-bump
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set image.tag and push
        env:
          SHA: ${{ github.sha }}
        run: |
          set -eu
          tag="sha-$(printf '%s' "$SHA" | cut -c1-7)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # A newer commit that changes what this workflow builds makes its own image and bumps for itself; do not put the tag
            # back to this older one (image jobs can finish out of order). The bump commits themselves do not count.
            newer="$(git log --format=%s "$SHA..origin/main" -- crates bin Cargo.toml Cargo.lock docker/operator docker/api deploy/operator deploy/operator-crds deploy/crds .github/workflows/operator-image.yml | grep -Ev '^chore\(deploy\): bump (operator|operator and api|operator, api and usage-ingest) to ' || true)"
            if [ -n "$newer" ]; then
              echo "main has moved on since $SHA; the newer build will bump"
              exit 0
            fi
            sh deploy/operator/bump-tag.sh deploy/operator/values.yaml "$tag" operator
            sh deploy/operator/bump-tag.sh deploy/operator/values.yaml "$tag" api
              if git diff --quiet -- deploy/operator/values.yaml; then
              echo "both tags are current"
              exit 0
            fi
            git add deploy/operator/values.yaml
            git commit -m "chore(deploy): bump operator and api to $tag"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push raced with another commit (attempt $attempt); retrying"
            sleep $((attempt * 3))
          done
          echo "could not push the bump" >&2
          exit 1
