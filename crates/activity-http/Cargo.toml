[package]
name = "aap-activity-http"
description = "The HTTP ActivitySource (AD-058, P2c): asks an agent's GET /internal/activity what work it holds"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aap-ports.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
aap-ports = { workspace = true, features = ["testkit"] }
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time"] }

[lints]
workspace = true
