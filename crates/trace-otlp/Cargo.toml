[package]
name = "aap-trace-otlp"
description = "The OTLP/HTTP JSON exporter of the operator and the Platform API traces (K5): the OTEL_* settings, the encoding, an exporter on reqwest 0.12 (rustls with ring) and a test collector"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `testkit::TestCollector`, an OTLP/JSON receiver on a local port that checks the shape of what it gets.
testkit = ["dep:axum", "tokio/net", "aap-trace/testkit"]

[dependencies]
aap-trace.workspace = true
# The exporter's client: the workspace's reqwest 0.12 with its one feature (rustls with ring). Nothing else is turned on:
# `rustls-tls` would add webpki-roots and the defaults native-tls, and 0.13's `rustls` is aws-lc-rs.
reqwest.workspace = true
serde.workspace = true
schemars.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# Already in the lock file (the binaries log with it): the one line the exporter says when exports start failing. No bridge.
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
url.workspace = true
axum = { workspace = true, optional = true }

[dev-dependencies]
aap-trace = { workspace = true, features = ["testkit"] }
aap-trace-otlp = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time", "sync", "test-util"] }
# Already in the lock file (the binaries and four other crates' tests use it): to read the one line the exporter logs.
tracing-subscriber.workspace = true

[lints]
workspace = true
