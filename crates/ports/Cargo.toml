[package]
name = "aap-ports"
description = "The provider seams of the v0 operator: RuntimeProvider, StoreProvisioner, AgentDirectory, their neutral types, and a conformance testkit"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The conformance macros and the `Memory` implementations. Off by default: the controller and the
# providers depend on the traits; their tests turn it on.
testkit = ["dep:tokio"]

[dependencies]
futures.workspace = true
serde.workspace = true
# The bodies of the custom resources the Platform API reads and writes (`AgentObjects`) are JSON.
serde_json.workspace = true
thiserror.workspace = true
# Only for the `Memory` implementations (a broadcast channel) and the timeouts of the conformance cases.
tokio = { workspace = true, features = ["sync", "time"], optional = true }

[dev-dependencies]
# Only `tests/objects.rs` reads it: the samples of the testkit are held to the real CRD types there. The
# library depends on nothing of the workspace.
aap-api.workspace = true
# The tests of this crate run the testkit it ships, so `cargo test -p aap-ports` works on its own.
aap-ports = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt", "sync", "time", "test-util"] }

[lints]
workspace = true
