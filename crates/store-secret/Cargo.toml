[package]
name = "aap-store-secret"
description = "StoreProvisioner for a referenced Secret (§59a, AD-024): it reports the reference and never reads a Secret"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `impl StoreUnderTest for SecretStore`, so a composition root can run the conformance suite of `aap-ports`.
testkit = ["aap-ports/testkit"]

[dependencies]
aap-ports.workspace = true

[dev-dependencies]
aap-store-secret = { workspace = true, features = ["testkit"] }
aap-ports = { workspace = true, features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
