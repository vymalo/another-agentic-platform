[package]
name = "aap-store-cnpg"
description = "StoreProvisioner for an operator-owned CloudNativePG Cluster (§59a, AD-024): server-side apply of postgresql.cnpg.io/v1 Cluster <service>-db, the reference to its <cluster>-app Secret, readiness from its status"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `impl StoreUnderTest for CnpgStore`, so a composition root can run the conformance suite of `aap-ports`
# against its own cluster. Off by default.
testkit = ["aap-ports/testkit"]

[dependencies]
aap-ports.workspace = true
aap-store-secret.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }
serde_json.workspace = true

[dev-dependencies]
aap-api.workspace = true
aap-domain.workspace = true
aap-ports = { workspace = true, features = ["testkit"] }
aap-store-cnpg = { workspace = true, features = ["testkit"] }
# The fake API server of tests/api.rs: a tower service in place of the HTTP client.
http = "1"
serde_yaml.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
