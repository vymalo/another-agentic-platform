[package]
name = "aap-tool-probe"
description = "The MCP probe of a ToolProvider (K3b, AD-053): initialize and tools/list over Streamable HTTP, the reachability and the tool names, and a stub server for the tests and the kind end-to-end"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
default = []
# `testkit::StubMcp`, an MCP server on a local port that answers initialize and tools/list as a case asks (tools, pages, a
# header it requires, a failure, a delay, an SSE answer). For this crate's tests and the controller's.
testkit = ["dep:axum", "tokio/net", "tokio/rt"]

# The stub MCP server of the kind end-to-end of the Platform API (K3b): an example, so that nothing ships it.
[[example]]
name = "test-mcp"
path = "examples/test-mcp.rs"
required-features = ["testkit"]

[dependencies]
# The MCP request. reqwest 0.12 with `rustls-tls-native-roots` is rustls with ring, the provider kube already brings: this
# crate adds no second TLS stack.
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
# `time` for the probe's deadline.
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
axum = { workspace = true, features = ["json"], optional = true }

[dev-dependencies]
# The tests run the testkit this crate ships, so `cargo test -p aap-tool-probe` works on its own.
aap-tool-probe = { workspace = true, features = ["testkit"] }
axum = { workspace = true, features = ["json"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "signal", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
