[package]
name = "aap-objects-kubernetes"
description = "AgentObjects on the Kubernetes API server (§60a, D5): server-side apply of AgentService, AgentConfig, ModelEndpoint and ToolProvider under the field manager agents.vymalo.com/dashboard, the ownership rules of AD-031, and the offered keys read from labelled ExternalSecrets"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aap-api.workspace = true
aap-ports.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
aap-ports = { workspace = true, features = ["testkit"] }
# The fake API server of tests/api.rs: a tower service in place of the HTTP client.
http = "1"
serde.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
url.workspace = true

[lints]
workspace = true
