[package]
name = "aap-usage-kubernetes"
description = "The AccountSource of the pod-minute meter for an agent's own pod (ANR-1100, AD-071): reads AgentService.spec.account from the API server, and never logs it"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aap-api.workspace = true
aap-usage.workspace = true
kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }

[dev-dependencies]
# The fake API server of tests/agents.rs: a tower service in place of the HTTP client.
http = "1"
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
