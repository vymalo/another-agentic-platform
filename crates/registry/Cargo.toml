[package]
name = "aap-registry"
description = "The agent-registry/v1 document builder and an axum router for it (§59a, AD-021): a linkset of agent cards from an AgentDirectory, behind one static bearer, with an ETag and 304"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aap-ports.workspace = true
axum.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
tracing.workspace = true
url.workspace = true

[dev-dependencies]
aap-ports = { workspace = true, features = ["testkit"] }
proptest.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
