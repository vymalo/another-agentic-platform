[package]
name = "aap-platform-api"
description = "The Platform API of the admin dashboard (§60a, D7a): an axum router generic over AgentObjects and Authenticator, one permission per route, problem details, ETag preconditions, CORS for the deployment's origins"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aap-api.workspace = true
aap-forms.workspace = true
aap-ports.workspace = true
# `matched-path`: the permission of a request is looked up by the route template that matched it, so a route that is not in
# the table of routes is refused and not served. No `json`, `query` or `form`: bodies are read and answered here, so that
# every refusal is a problem detail and none quotes a value.
axum = { workspace = true, features = ["matched-path"] }
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tower-http.workspace = true
tracing.workspace = true

[dev-dependencies]
aap-auth-oidc = { workspace = true, features = ["testkit"] }
aap-ports = { workspace = true, features = ["testkit"] }
http = "1"
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
