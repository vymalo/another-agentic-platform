[package]
name = "aap-leader-kubernetes"
description = "Leader election on Kubernetes (K7a, AD-020): a coordination.k8s.io/v1 Lease that one replica of the operator holds, renews and releases, and that the others take over when it expires"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `impl LeaderElectionUnderTest for LeaseElection`, so a composition root (or the cluster test) can run the
# conformance suite of `aap-ports` against its own cluster. Off by default.
testkit = ["aap-ports/testkit"]

[dependencies]
aap-ports.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }
# The renewals, the retries and the bounded wait of the release; `select!` is a macro.
tokio = { workspace = true, features = ["macros", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
aap-ports = { workspace = true, features = ["testkit"] }
# The tests run the testkit this crate ships, so `cargo test -p aap-leader-kubernetes` enables its `testkit`
# feature for them (the same self-dev-dependency `aap-ports` uses).
aap-leader-kubernetes = { workspace = true, features = ["testkit"] }
# The fake API server of tests/api.rs: a tower service in place of the HTTP client.
http = "1"
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
