[package]
name = "aap-usage-otlp"
description = "The UsageSink adapter of aap-usage (ANR-1102, AD-069): pod-minute events sent to the OpenTelemetry Collector as OTLP/HTTP JSON logs, with a bounded queue, retries that keep the batch, and a test collector"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# `testkit::TestCollector` (an OTLP/JSON logs receiver on a local port) and `testkit::ObservedOtlp` (the conformance wrapper).
testkit = ["tokio/net", "tokio/io-util", "aap-usage/testkit"]

[dependencies]
aap-usage.workspace = true
# The client: the workspace's reqwest 0.12 with its one feature (rustls with ring), as aap-trace-otlp. No new package.
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }
url.workspace = true

[dev-dependencies]
aap-usage = { workspace = true, features = ["testkit"] }
aap-usage-otlp = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "net", "io-util", "time", "sync"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
