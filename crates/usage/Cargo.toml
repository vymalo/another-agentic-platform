[package]
name = "aap-usage"
description = "The usage port (ANR-673, AD-069): the pod-minute event, the UsageSink seam an adapter implements (the OTLP exporter comes later), the AccountSource seam, a conformance testkit and in-memory fakes"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The conformance suite and the in-memory fakes, for every adapter's tests. Off by default.
testkit = ["dep:tokio"]

[dependencies]
sha2.workspace = true
thiserror.workspace = true
# Only the testkit's rule 5 waits (for an adapter whose outcomes arrive from a task); no new package.
tokio = { workspace = true, optional = true, features = ["time"] }

[dev-dependencies]
# The crate's own tests run the testkit it ships.
aap-usage = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
