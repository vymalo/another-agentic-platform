[package]
name = "aap-usage"
description = "The usage ingest's port (ANR-728, AD-060): the pod-minute event, the UsageStore seam that takes each event once and answers spend per account by ingestion window, its conformance testkit and an in-memory fake"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# The conformance suite and `MemoryUsageStore`, for every adapter's tests. Off by default.
testkit = []

[dependencies]
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The crate's own tests run the testkit it ships.
aap-usage = { path = ".", features = ["testkit"] }
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
