apiVersion: v1
data:
  pod.yaml: |
    {
      "apiVersion": "v1",
      "kind": "Pod",
      "metadata": {
        "labels": {
          "app.kubernetes.io/component": "run",
          "app.kubernetes.io/name": "coder-run"
        }
      },
      "spec": {
        "affinity": {
          "podAffinity": {
            "requiredDuringSchedulingIgnoredDuringExecution": [
              {
                "labelSelector": {
                  "matchLabels": {
                    "app.kubernetes.io/instance": "coder",
                    "app.kubernetes.io/name": "coder"
                  }
                },
                "topologyKey": "kubernetes.io/hostname"
              }
            ]
          }
        },
        "automountServiceAccountToken": false,
        "containers": [
          {
            "command": [
              "tini",
              "--",
              "sleep",
              "infinity"
            ],
            "env": [
              {
                "name": "CARGO_BUILD_JOBS",
                "value": "2"
              },
              {
                "name": "HTTPS_PROXY",
                "value": "http://coder-egress.another-agentic-system.svc:3128"
              },
              {
                "name": "https_proxy",
                "value": "http://coder-egress.another-agentic-system.svc:3128"
              },
              {
                "name": "HTTP_PROXY",
                "value": "http://coder-egress.another-agentic-system.svc:3128"
              },
              {
                "name": "http_proxy",
                "value": "http://coder-egress.another-agentic-system.svc:3128"
              },
              {
                "name": "NO_PROXY",
                "value": "localhost,127.0.0.1"
              },
              {
                "name": "no_proxy",
                "value": "localhost,127.0.0.1"
              },
              {
                "name": "MODEL_API_KEY",
                "valueFrom": {
                  "secretKeyRef": {
                    "key": "MODEL_API_KEY",
                    "name": "coder-secrets"
                  }
                }
              }
            ],
            "image": "ghcr.io/vymalo/another-agentic-images/workspace:1.98.1-e6a528f@sha256:d2aae762ecad2c13bb697332507d236a75d8233d061f38cc97dc9227192b0797",
            "imagePullPolicy": "IfNotPresent",
            "name": "run",
            "resources": {
              "limits": {
                "memory": "2Gi"
              },
              "requests": {
                "cpu": "250m",
                "memory": "512Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/work",
                "name": "work"
              },
              {
                "mountPath": "/opt/adam/bin",
                "name": "tools",
                "readOnly": true
              }
            ],
            "workingDir": "/work"
          }
        ],
        "enableServiceLinks": false,
        "initContainers": [
          {
            "command": [
              "sh",
              "-c",
              "cp -L /opt/adam/bin/adam-exec /opt/adam/bin/opencode /tools/ && chmod 0755 /tools/adam-exec /tools/opencode"
            ],
            "image": "ghcr.io/vymalo/another-adam-rs/coder:sha-0391809@sha256:814d8ee329a5e4d8634e8a82532c035999c4be27aac086508b742a635449ea40",
            "imagePullPolicy": "IfNotPresent",
            "name": "tools",
            "resources": {
              "limits": {
                "memory": "256Mi"
              },
              "requests": {
                "cpu": "10m",
                "memory": "32Mi"
              }
            },
            "securityContext": {
              "allowPrivilegeEscalation": false,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/tools",
                "name": "tools"
              }
            ]
          }
        ],
        "priorityClassName": "coder-run",
        "securityContext": {
          "fsGroup": 10001,
          "fsGroupChangePolicy": "OnRootMismatch",
          "runAsGroup": 10001,
          "runAsNonRoot": true,
          "runAsUser": 10001,
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "terminationGracePeriodSeconds": 5,
        "volumes": [
          {
            "name": "work",
            "persistentVolumeClaim": {
              "claimName": "work-coder-0"
            }
          },
          {
            "emptyDir": {},
            "name": "tools"
          }
        ]
      }
    }
