[package]
name = "aap-controller"
description = "The reconcilers of the v0 operator (§59a): AgentService and AgentConfig controllers over the RuntimeProvider and StoreProvisioner seams, and an AgentDirectory backed by a reflector"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aap-api.workspace = true
aap-domain.workspace = true
aap-ports.workspace = true
futures.workspace = true
k8s-openapi.workspace = true
# `unstable-runtime` is for `Controller::reconcile_on`: it is how the ids of `RuntimeProvider::watch()` reach the
# reconciler. The version is pinned by Cargo.lock; see the README ("kube-rs").
kube = { workspace = true, features = ["client", "rustls-tls", "ring", "runtime", "unstable-runtime"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
aap-ports = { workspace = true, features = ["testkit"] }
bytes = "1"
http = "1"
http-body = "1"
http-body-util = "0.1"
serde_yaml.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tower = { version = "0.5", default-features = false, features = ["util"] }

[lints]
workspace = true
