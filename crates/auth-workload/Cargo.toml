[package]
name = "aap-auth-workload"
description = "The Platform API's ClientAuthenticator for a workload certificate (AD-065, ANR-1010): one configured CA bundle, the client-authentication extended key usage, notAfter, and the exact URI SAN mapped to platform:agents.own and nothing else"
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[features]
# A PKI minted at run time for tests (the checked-in fixtures have no keys, so they cannot complete a handshake). Test tooling: in no image.
testkit = ["dep:rcgen"]

[dependencies]
aap-ports.workspace = true
rustls-pki-types.workspace = true
rustls-webpki.workspace = true
serde.workspace = true
thiserror.workspace = true
tracing.workspace = true
x509-parser.workspace = true
rcgen = { workspace = true, optional = true }

[dev-dependencies]
aap-auth-workload = { path = ".", features = ["testkit"] }
aap-ports = { workspace = true, features = ["testkit"] }
serde_yaml.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
tracing-subscriber.workspace = true

[lints]
workspace = true
