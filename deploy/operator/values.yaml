# The operator of §59a, for one namespace. Nothing here is a secret: the registry's bearer token is an existing Secret
# (registry.tokenSecret) or a property of an AWS Secrets Manager secret read by External Secrets (externalSecrets).
# The CRDs are NOT in this chart (§93: a separate Argo CD app): install and upgrade deploy/operator-crds first (README "Upgrading").
# templates/_validate.tpl refuses what would deploy something other than what it says.

nameOverride: ""
# Every object is named <fullname>[-<part>]. Fixed, so the registry's Service has a name that does not follow the release's
# (the system's chart reads it as AGENT_REGISTRY_URL).
fullnameOverride: aap-operator

image:
  repository: ghcr.io/vymalo/another-agentic-platform/operator
  # Bumped on every green build of main by .github/workflows/operator-image.yml (`sha-<7 hex>`), with
  # deploy/operator/bump-tag.sh: a plain key, written by that script only. `latest` is refused.
  tag: sha-58ad0f3
  # Optional `sha256:...`: when set the image is `repository:tag@digest`.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# The namespace the operator watches, and where its Role and RoleBinding are made. Empty: the release's namespace.
# One namespace by design (§93, "a namespaced operator"): there is no value that gives it a ClusterRole.
watchNamespace: ""

# The image of an agent whose AgentConfig names none (AD-029, §60a): the coder image, by tag AND digest. Empty: the operator has no default,
# and an agent that names no image is `ConfigInvalid`. A new value rolls every agent that names none, through the config digest, and
# no agent that pins its own. It is NOT moved by bump-tag.sh (that is the operator's own `image.tag`): move it by hand, or from the
# GitOps repository's values, after reading the digest from ghcr.io (README "The default agent image"). This pin is the one the kind
# end-to-end of the coder runs (tests/e2e/coder.yaml), and `cargo test -p aap-operator` fails when the two differ.
defaultAgentImage: ghcr.io/vymalo/another-adam-rs/coder:sha-9a1fd4e@sha256:c3c178b7d73599f40d53f798616e510346abd3300a622b09b2bc233109f12b44

serviceAccount:
  create: true
  # Empty: the fullname. Required when `create` is false.
  name: ""
  annotations: {}

# Rights on CloudNativePG `Cluster`s in the watched namespace (get, patch, create, delete). The image is built with the
# `store-cnpg` feature, so a service with `store.postgres.cnpg` asks for one: off, such a service is refused by the API server,
# and `false` is for a cluster that has no CloudNativePG at all.
storeCnpg: true

# The agent registry (§12b, crates/registry/README.md), served on 8080 only with a bearer token: no token, no registry. The
# token comes from exactly one of the two below, and none of them is a value of this chart.
registry:
  # An existing Secret in the release's namespace that holds the token (the operator reads the file once, at start: after
  # a change, restart the pod).
  tokenSecret:
    name: ""
    key: token
  # `REGISTRY_PUBLIC_URL`: the URL of the registry document itself, sent as its `anchor`. Optional.
  publicUrl: ""

# The token from AWS Secrets Manager through External Secrets (the ARC runner pools of home-os, and the system chart):
# one ExternalSecret, `<fullname>-registry`, whose Secret has the key `token`. Off: an existing Secret, or no registry.
externalSecrets:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  key: prod/another-agentic/env
  properties:
    # The AWS property that holds the token: random, at least 32 bytes (`openssl rand -hex 32`). The consumer of the registry
    # (the system's orchestrator) reads the same property as AGENT_REGISTRY_TOKEN, so the two sides cannot differ.
    registryToken: agent_registry_token

# What may reach the operator, and what it may reach. Ingress is closed except what is listed; egress goes to the API server only.
networkPolicy:
  enabled: true
  registry:
    # Who may read the registry (NetworkPolicyPeers: namespaceSelector, podSelector, ipBlock). REQUIRED while a registry token is
    # set and networkPolicy is enabled: an empty list would make the registry unreachable, which is refused. A peer with only a
    # podSelector means the pods of the watched namespace.
    allowFrom: []
  metrics:
    # Who may scrape /metrics (9090). Empty: nobody.
    allowFrom: []
  apiServer:
    # The ports of the API server as the pod reaches it (the Service is 443, the endpoint of most clusters 6443).
    ports: [443, 6443]
    # Optional: only these addresses (`kubectl get endpoints kubernetes`). Empty: any address on those ports.
    cidrs: []

# Settings of `operator run` that have a default (bin/operator/README.md, "run: settings"); a key left out keeps the default.
logLevel: info
tuning: {}
  # concurrency: 4          # AAP_CONCURRENCY: services reconciled at once
  # resyncSecs: 300         # AAP_RESYNC_SECS: timer of a service that is Ready or Suspended
  # resyncPendingSecs: 15   # AAP_RESYNC_PENDING_SECS: timer of one that is rolling out, unwell or held by a foreign object

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
priorityClassName: ""
nodeSelector: {}
tolerations: []
affinity: {}

# ---- The Platform API (§60a, AD-025, AD-027; slice D7b1) --------------------------------------------------------------------
# The admin dashboard's REST API (`bin/api`, binary `api`), a Deployment of its own beside the operator and OFF by default. It has
# its own ServiceAccount and Role (it may write the specs people edit and list the ExternalSecrets that offer keys; the operator may
# not, and the operator writes workloads, which the API may not) and takes people's tokens, which the operator does not. Stateless:
# two replicas are fine. Nothing here is a secret: the API checks a token against the issuer's public keys and reaches the cluster with
# its ServiceAccount (bin/api/README.md, "The configuration file"). templates/_validate.tpl refuses what it can check at render time and
# the binary would refuse at start; the rest the binary refuses at start (a pod that never becomes ready, the old ones still serving), and
# the `--check` of CI on the file rendered for each tested shape is what looks for such a value. What a deployment must provide, and the edge's part
# (TLS, a JWT check, a rate limit per token): README "The Platform API".
api:
  enabled: false
  image:
    repository: ghcr.io/vymalo/another-agentic-platform/api
    # Bumped on every green build of main by .github/workflows/operator-image.yml (`sha-<7 hex>`), with
    # `deploy/operator/bump-tag.sh <file> <tag> api`: a plain key, written by that script only, in step with `image.tag`
    # (one workflow builds both images from one commit). `latest` is refused. `sha-0000000` is a placeholder: no image has that tag.
    tag: sha-0000000
    # Optional `sha256:...`: when set the image is `repository:tag@digest`.
    digest: ""
    pullPolicy: IfNotPresent
  # The API is stateless. With more than one, give `affinity` or `topologySpreadConstraints` a reason to spread them.
  replicas: 1
  # The API listens on `port` and serves /healthz and /readyz on `healthPort`: the chart writes both into the configuration file
  # (`listen`, `healthListen`), so a probe, the Service and the file cannot disagree. Neither is a key of `config`.
  port: 8080
  healthPort: 8081
  logLevel: info

  # The configuration file of the binary (`bin/api/config.example.yaml` documents every key), rendered as a ConfigMap and mounted at
  # /etc/aap-api/config.yaml. An unknown key is refused by the binary at every level. Keys the chart owns: `listen` and `healthListen`
  # (from `port` and `healthPort`) and `defaults.namespace` (the namespace the operator watches, which is where the Role is).
  config:
    # Whose tokens are accepted. REQUIRED, nothing to default: the issuer, at least one audience (`aud`), and the claim whose values
    # are the person's permissions (`agentic_roles` on netcup). `jwksUrl` is for an issuer whose discovery document does not say it.
    oidc:
      issuer: ""
      audiences: []
      rolesClaim: ""
      # jwksUrl: https://keycloak.example.com/realms/another-agentic/protocol/openid-connect/certs
    # The browser origins that may call the API (the web as a single-page app, the native shells): exact origins, `scheme://host[:port]`,
    # lower case, no path, no wildcard, and not the default port of the scheme. Empty: no CORS. Added to what the edge does: none.
    cors:
      allowedOrigins: []
    # What every new agent gets besides what its form sets (aap_forms::Defaults). A map is merged with the one here, a list replaces it.
    # `store` is exactly one of `cnpg` and `secretRef`: to switch, say `cnpg: null` beside the new one.
    defaults:
      store:
        cnpg:
          instances: 1
          storage:
            size: 5Gi
      # The Secret key that must hold the orchestrator's AGENT_REGISTRY_AGENT_TOKEN, or the orchestrator lists an agent and cannot call it.
      a2aBearer:
        name: agent-a2a-bearer
        key: AGENT_REGISTRY_AGENT_TOKEN
      # `access.allowFrom` of a new agent: the peers that may reach it (the orchestrator's namespace). Empty: nobody can call a new agent.
      allowFrom: []
      # The registries an agent may pin its own image from. REQUIRED, at least one, nothing to default: a person who may write agents can
      # name a folder agent's image, and that pod is handed the model endpoint's API key and the A2A bearer. An entry is a registry host and
      # does NOT bound repositories (`ghcr.io` admits every image on ghcr.io): name only registries whose images you trust.
      allowedImageRegistries: []

  serviceAccount:
    create: true
    # Empty: <fullname>-api. Required when `create` is false.
    name: ""
    annotations: {}

  # Rolling update with a surge and no unavailable pod. A pod that is going stays in the Service for `preStopSleepSeconds` before the
  # signal (the API's listener closes at the signal and its endpoints leave the Service a moment later), then drains for at most 25 s
  # (bin/api/src/run.rs, DRAIN). The sleep counts against `terminationGracePeriodSeconds` (verified 2026-10-16, kubernetes.io container
  # lifecycle hooks), so the grace period must hold the sleep, the drain and a margin: the chart refuses less than the sleep + 30.
  # `lifecycle.preStop.sleep` is a feature gate that is alpha and OFF in Kubernetes 1.29, beta and on from 1.30 and GA in 1.34 (verified
  # 2026-10-16, kubernetes.io feature gates): on 1.29 enable PodLifecycleSleepAction or set 0, which renders no hook.
  terminationGracePeriodSeconds: 40
  preStopSleepSeconds: 5

  # The edge's route to the API (§60a, "Clients without a web server"): TLS, a check of the JWT, and RATE LIMITS PER TOKEN are the edge's
  # and not the API's. This chart makes the Ingress and passes `annotations` through, which is where a Traefik Middleware or an NGINX
  # setting is attached (README "The Platform API", an example). Off: the API is a ClusterIP Service and a deployment routes to it itself.
  ingress:
    enabled: false
    className: ""
    host: ""
    path: /v1
    pathType: Prefix
    annotations: {}
    tls:
      enabled: true
      # Empty: the edge's default certificate (a `tls` block with the host and no secret).
      secretName: ""

  # What may reach the API, and what it may reach. Ingress is closed except `from`; the kubelet's probes come from the node, which a
  # NetworkPolicy never blocks (as in the operator's). The operator's policy lets the API server in and nothing else out; the API also
  # resolves names and fetches the issuer's keys, so it has two more egress rules (dns, issuer).
  networkPolicy:
    enabled: true
    # Who may reach the API port (NetworkPolicyPeers: namespaceSelector, podSelector, ipBlock): the edge, that is the pods of the Ingress
    # controller (Traefik). REQUIRED while the policy is enabled: an empty list would make the API unreachable, which is refused.
    from: []
    apiServer:
      # The ports of the API server as the pod reaches it (the Service is 443, the endpoint of most clusters 6443).
      ports: [443, 6443]
      # Optional: only these addresses (`kubectl get endpoints kubernetes`). Empty: any address on those ports.
      cidrs: []
    dns:
      # Where the names are resolved (NetworkPolicyPeers), on `ports` over UDP and TCP. Empty: any address on those ports.
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports: [53]
    issuer:
      # Where the issuer's keys are fetched from (NetworkPolicyPeers or an ipBlock), on `ports`. Empty: any address on those ports.
      to: []
      # The port of the issuer's URL (and of `jwksUrl` when it names another host): 443 for https. An issuer inside the cluster says its own.
      ports: [443]

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  podLabels: {}
  priorityClassName: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}
  topologySpreadConstraints: []
