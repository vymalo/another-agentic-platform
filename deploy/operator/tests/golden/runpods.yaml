metadata:
  name: aap-operator-agents-run
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
value: 0
preemptionPolicy: Never
globalDefault: false
description: "Run pods of the agents of agents (aap-operator): scoped by a ResourceQuota, ranks nothing."
