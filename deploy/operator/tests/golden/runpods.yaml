            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: run-pods
              mountPath: /etc/aap/run-pods
              readOnly: true
      volumes:
        - name: run-pods
          configMap:
            name: aap-operator-run-pods-settings
            defaultMode: 288 # 0440
