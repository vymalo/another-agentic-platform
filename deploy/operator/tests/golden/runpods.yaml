# runPods.enabled: the priority class of run pods. It exists to be scoped by: a ResourceQuota cannot select pods by label, but it can
# by priority class. Value 0 and preemptionPolicy Never: it ranks nothing and evicts nobody. Cluster-scoped (so the operator, which
