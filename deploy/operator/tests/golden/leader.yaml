# Source: aap-operator/templates/deployment.yaml
# K7: more than one replica is a rolling update whose replicas campaign for a Lease in the primary namespace, and only its
# holder reconciles. Both replicas keep their caches and serve the registry, so `/readyz` keeps its meaning (the caches have
# listed) and the PodDisruptionBudget can move the lease.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator
        app.kubernetes.io/instance: aap-operator
    spec:
      serviceAccountName: aap-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-agentic-platform/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          args: [run]
          env:
            # K6b: every namespace the operator watches, comma separated (the chart makes the Role and RoleBinding in each).
            # WATCH_NAMESPACE below is the primary, which must be one of them: it names the cluster-scoped objects and the
            # API's defaults.namespace.
            - name: WATCH_NAMESPACES
              value: "agents"
            - name: WATCH_NAMESPACE
              value: "agents"
            # K7: the lease every replica campaigns for; the holder reconciles, the others keep their caches and serve the registry.
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEADER_ELECTION_NAME
              value: "aap-operator"
            - name: LEADER_ELECTION_NAMESPACE
              value: "agents"
            - name: LEADER_ELECTION_LEASE_SECS
              value: "15"
            - name: LEADER_ELECTION_RENEW_SECS
              value: "10"
            - name: LEADER_ELECTION_RETRY_SECS
              value: "2"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
            # AD-029: the image of an agent whose AgentConfig names none. A new value rolls those agents, and no other.
            - name: DEFAULT_AGENT_IMAGE
              value: "ghcr.io/vymalo/another-adam-rs/coder:sha-9a1fd4e@sha256:c3c178b7d73599f40d53f798616e510346abd3300a622b09b2bc233109f12b44"
            # K7: with the election on, a pass must finish before the renew deadline (the default 5 s is below the 10 s
            # renew); with one replica the binary's own 60 s applies.
            - name: AAP_RECONCILE_TIMEOUT_SECS
              value: "5"
            # No token, no registry: this variable is what turns it on.
            - name: REGISTRY_TOKEN_FILE
              value: /var/run/secrets/aap/registry/token
          ports:
            - name: registry
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: registry-token
              mountPath: /var/run/secrets/aap/registry
              readOnly: true
      volumes:
        - name: registry-token
          secret:
            secretName: e2e-registry-token
            defaultMode: 288 # 0440
            items:
              - key: token
                path: token
