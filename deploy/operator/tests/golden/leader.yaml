---
# Source: aap-operator/templates/deployment.yaml
# K7: more than one replica is a rolling update whose replicas campaign for a Lease in the primary namespace, and only its
# holder reconciles. Both replicas keep their caches and serve the registry, so `/readyz` keeps its meaning (the caches have
# listed) and the PodDisruptionBudget can move the lease.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator
        app.kubernetes.io/instance: aap-operator
      annotations:
        # The configuration file is read once, at start: a changed file is a new pod (ANR-962).
        checksum/config: 86372799acdc1aae39b3da70007d2ee959bc3c60a7975dc15b3eac34d17755c7
    spec:
      serviceAccountName: aap-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-agentic-platform/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          # The file is the only way in (ANR-962): no setting is an environment variable any more.
          args: [run, --config, /etc/aap-operator/config.yaml]
          env:
            # The downward API's identity of this replica (the reporting instance of Events and the lease's holderIdentity).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: registry
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The configuration file (ANR-962), read once at start.
            - name: config
              mountPath: /etc/aap-operator
              readOnly: true
            - name: registry-token
              mountPath: /var/run/secrets/aap/registry
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aap-operator
            defaultMode: 288 # 0440
        - name: registry-token
          secret:
            secretName: e2e-registry-token
            defaultMode: 288 # 0440
            items:
              - key: token
                path: token
