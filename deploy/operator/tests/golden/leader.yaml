# Source: aap-operator/templates/role.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-operator
  namespace: agents
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
rules:
  # aap-controller: the two kinds (patch also writes metadata.finalizers), their status, and Events.
  - apiGroups: [agents.vymalo.com]
    resources: [agentservices, agentconfigs]
    verbs: [get, list, watch, patch]
  # aap-controller: the shared objects of the dashboard (AD-029) are read, to resolve a reference and to watch it, and never written (their status is, below).
  - apiGroups: [agents.vymalo.com]
    resources: [modelendpoints, toolproviders]
    verbs: [get, list, watch]
  - apiGroups: [agents.vymalo.com]
    resources: [agentservices/status, agentconfigs/status]
    verbs: [patch]
  # aap-controller, K2: the status of the shared kinds (who uses them, whether they are valid, whether their agents are Ready), written
  # by server-side apply and nothing more: `patch` on the status subresource only. The two kinds themselves stay read-only (the rule above).
  - apiGroups: [agents.vymalo.com]
    resources: [modelendpoints/status, toolproviders/status]
    verbs: [patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # aap-runtime-kubernetes: the objects an agent is made of.
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, patch, create, delete]
  # aap-controller, ANR-1327: the owner chain of an agent's pod, walked to its AgentService (a pod's ReplicaSet, the
  # Deployment above it, a StatefulSet, or a Job). `get` alone, by name: no list and no watch. A StatefulSet's `get`
  # is in the rule above already.
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get]
  - apiGroups: [""]
    resources: [services, configmaps, persistentvolumeclaims]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  # aap-store-cnpg: the Cluster of a service that asks for one. None on databases, poolers or clusters/status.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, patch, create, delete]
  # K7: the leader's Lease, in the primary namespace (this Role). `get` and `update` are narrowed to its name; `create`
  # cannot be (RBAC ignores resourceNames for create). No delete: a released lease stays, with its holder cleared.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, update]
    resourceNames: [aap-operator]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]

