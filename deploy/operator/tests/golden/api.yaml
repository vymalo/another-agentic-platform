# Source: aap-operator/templates/api-configmap.yaml
# The configuration file of the Platform API (bin/api/config.example.yaml). There is no secret in it and no place for one: the API
# checks tokens against the issuer's public keys and reaches the cluster with its ServiceAccount. `listen`, `healthListen` and
# `defaults.namespace` are the chart's (api.port, api.healthPort, the namespace the operator watches).
apiVersion: v1
kind: ConfigMap
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
data:
  config.yaml: |
    cors:
      allowedOrigins:
      - https://agents.example.com
      - tauri://localhost
    defaults:
      a2aBearer:
        key: AGENT_REGISTRY_AGENT_TOKEN
        name: agent-a2a-bearer
      allowFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: another-agentic-system
      allowedImageRegistries:
      - ghcr.io
      namespace: agents
      store:
        cnpg:
          instances: 1
          storage:
            size: 5Gi
    healthListen: 0.0.0.0:8081
    listen: 0.0.0.0:8080
    oidc:
      audiences:
      - another-agentic
      issuer: https://keycloak.example.com/realms/another-agentic
      jwksUrl: https://keycloak.example.com/realms/another-agentic/protocol/openid-connect/certs
      rolesClaim: agentic_roles
