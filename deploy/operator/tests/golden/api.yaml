# Source: aap-operator/templates/api-deployment.yaml
# The Platform API (bin/api): stateless, so more than one replica is fine. A rolling update that surges and loses no pod; the pod stays in
# the Service for a few seconds before the signal (preStop), then the API drains for at most 25 s, inside the grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator-api
      app.kubernetes.io/instance: aap-operator
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator-api
        app.kubernetes.io/instance: aap-operator
        app.kubernetes.io/component: api
      annotations:
        # A change of the configuration rolls the pods (the file is read once, at start).
        checksum/config: 2084311f10588ed01d18c51333a4e9b6bb186900949cd945165cb59604013e7f
    spec:
      serviceAccountName: aap-operator-api
      # The API token is the API's way to the cluster.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "ghcr.io/vymalo/another-agentic-platform/api:sha-0000000"
          imagePullPolicy: IfNotPresent
          env:
            - name: API_CONFIG_FILE
              value: /etc/aap-api/config.yaml
            - name: RUST_LOG
              value: "info"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready while the issuer's keys can be had and the cluster answers a call that needs the API's own rights (bin/api/README.md).
          # A pod that is draining answers 503 at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          # The Service takes a moment to drop an endpoint: keep serving until it has. The distroless image has no `sleep` to run, so
          # this is the kubelet's own sleep action (Kubernetes 1.30 and later, or the gate on 1.29: values.yaml).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/aap-api
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aap-operator-api
---
# Source: aap-operator/templates/deployment.yaml
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator
        app.kubernetes.io/instance: aap-operator
    spec:
      serviceAccountName: aap-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-agentic-platform/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          args: [run]
          env:
            - name: WATCH_NAMESPACE
              value: "agents"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
            # AD-029: the image of an agent whose AgentConfig names none. A new value rolls those agents, and no other.
            - name: DEFAULT_AGENT_IMAGE
              value: "ghcr.io/vymalo/another-adam-rs/coder:sha-9a1fd4e@sha256:c3c178b7d73599f40d53f798616e510346abd3300a622b09b2bc233109f12b44"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
# Source: aap-operator/templates/api-ingress.yaml
# The edge's route to the API (§60a, "Clients without a web server"). TLS, a check of the JWT and a rate limit per token are the edge's:
# attach them with api.ingress.annotations (README "The Platform API"). The API answers CORS preflights itself, so the edge must let an
# OPTIONS request through to it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: another-agentic-system-api-ratelimit@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - "api.agents.example.com"
      secretName: api-agents-tls
  rules:
    - host: "api.agents.example.com"
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: aap-operator-api
                port:
                  name: http
