# Source: aap-operator/templates/api-deployment.yaml
# The Platform API (bin/api): stateless, so more than one replica is fine. A rolling update that surges and loses no pod; the pod stays in
# the Service for a few seconds before the signal (preStop), then the API drains for at most 25 s, inside the grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator-api
      app.kubernetes.io/instance: aap-operator
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator-api
        app.kubernetes.io/instance: aap-operator
        app.kubernetes.io/component: api
      annotations:
        # A change of the configuration rolls the pods (the file is read once, at start).
        checksum/config: c0d991a897203ccd43d87ba9708bf5f471a14fad8ed372d5fc27714640db3d4a
    spec:
      serviceAccountName: aap-operator-api
      # The API token is the API's way to the cluster.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted headers file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "ghcr.io/vymalo/another-agentic-platform/api:sha-0000000"
          imagePullPolicy: IfNotPresent
          env:
            - name: API_CONFIG_FILE
              value: /etc/aap-api/config.yaml
            - name: RUST_LOG
              value: "info"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: workload
              containerPort: 9443
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready while the issuer's keys can be had and the cluster answers a call that needs the API's own rights (bin/api/README.md).
          # A pod that is draining answers 503 at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          # The Service takes a moment to drop an endpoint: keep serving until it has. The distroless image has no `sleep` to run, so
          # this is the kubelet's own sleep action (on from Kubernetes 1.30 and GA in 1.34; the chart's floor is 1.37: values.yaml).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/aap-api
              readOnly: true
            # The server certificate and the CA bundle of the workload listener (ANR-1011): files, never a value of the configuration.
            - name: workload-tls
              mountPath: /etc/aap-api-workload/tls
              readOnly: true
            - name: workload-ca
              mountPath: /etc/aap-api-workload/ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aap-operator-api
        - name: workload-tls
          secret:
            secretName: "aap-api-workload-tls"
            defaultMode: 288 # 0440
        - name: workload-ca
          configMap:
            name: "aap-api-workload-ca"
            items:
              - key: "ca-bundle.pem"
                path: ca.crt

