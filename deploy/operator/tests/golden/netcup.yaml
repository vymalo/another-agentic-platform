# Source: aap-operator/templates/deployment.yaml
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator
        app.kubernetes.io/instance: aap-operator
    spec:
      serviceAccountName: aap-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-agentic-platform/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          args: [run]
          env:
            - name: WATCH_NAMESPACE
              value: "another-agentic-system"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
            # No token, no registry: this variable is what turns it on.
            - name: REGISTRY_TOKEN_FILE
              value: /var/run/secrets/aap/registry/token
            - name: REGISTRY_PUBLIC_URL
              value: "http://aap-operator-registry.another-agentic-system.svc:8080/registry/v1/agents"
          ports:
            - name: registry
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: registry-token
              mountPath: /var/run/secrets/aap/registry
              readOnly: true
      volumes:
        - name: registry-token
          secret:
            secretName: aap-operator-registry
            defaultMode: 288 # 0440
            items:
              - key: token
                path: token
---
# Source: aap-operator/templates/externalsecret.yaml
# The registry's bearer token lives in AWS Secrets Manager (`prod/another-agentic/env`, one JSON property per value) and is copied into
# the Secret below by External Secrets. It is not in this chart, its values or its render.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aap-operator-registry
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: ssegning-aws
    kind: ClusterSecretStore
  target:
    name: aap-operator-registry
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: prod/another-agentic/env
        property: agent_registry_token
