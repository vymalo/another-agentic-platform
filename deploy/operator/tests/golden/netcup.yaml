apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aap-operator
  namespace: another-agentic-system
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
rules:
  # aap-controller: the two kinds (patch also writes metadata.finalizers), their status, and Events.
  - apiGroups: [agents.vymalo.com]
    resources: [agentservices, agentconfigs]
    verbs: [get, list, watch, patch]
  - apiGroups: [agents.vymalo.com]
    resources: [agentservices/status, agentconfigs/status]
    verbs: [patch]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
  # aap-runtime-kubernetes: the objects an agent is made of.
  - apiGroups: [apps]
    resources: [statefulsets, deployments]
    verbs: [get, list, watch, patch, create, delete]
  - apiGroups: [""]
    resources: [services, configmaps, persistentvolumeclaims]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, patch, create, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list, watch]
  # aap-store-cnpg: the Cluster of a service that asks for one. None on databases, poolers or clusters/status.
  - apiGroups: [postgresql.cnpg.io]
    resources: [clusters]
    verbs: [get, patch, create, delete]
