# Source: aap-operator/templates/api-deployment.yaml
# The Platform API (bin/api): stateless, so more than one replica is fine. A rolling update that surges and loses no pod; the pod stays in
# the Service for a few seconds before the signal (preStop), then the API drains for at most 25 s, inside the grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator-api
      app.kubernetes.io/instance: aap-operator
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator-api
        app.kubernetes.io/instance: aap-operator
        app.kubernetes.io/component: api
      annotations:
        # A change of the configuration rolls the pods (the file is read once, at start).
        checksum/config: ce18ccb2fb2939d9e0ed64ed868dc89128aa2a62a7e945cec89cc98c4aba88e0
    spec:
      serviceAccountName: aap-operator-api
      # The API token is the API's way to the cluster.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted headers file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "ghcr.io/vymalo/another-agentic-platform/api:sha-0000000"
          imagePullPolicy: IfNotPresent
          env:
            - name: API_CONFIG_FILE
              value: /etc/aap-api/config.yaml
            - name: RUST_LOG
              value: "info"
            # Traces (slice K5): the variables `api` reads. Absent, no span is made.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "https://otel-gateway.observability.svc:4319/v1/traces"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/json
            - name: OTEL_TRACES_SAMPLER
              value: "always_on"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=prod"
            - name: AAP_OTEL_HEADERS_FILE
              value: /var/run/secrets/aap/otel/headers
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /etc/aap/otel/ca/ca.pem
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready while the issuer's keys can be had and the cluster answers a call that needs the API's own rights (bin/api/README.md).
          # A pod that is draining answers 503 at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          # The Service takes a moment to drop an endpoint: keep serving until it has. The distroless image has no `sleep` to run, so
          # this is the kubelet's own sleep action (Kubernetes 1.30 and later, or the gate on 1.29: values.yaml).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/aap-api
              readOnly: true
            
            - name: otel-headers
              mountPath: /var/run/secrets/aap/otel
              readOnly: true
            - name: otel-ca
              mountPath: /etc/aap/otel/ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aap-operator-api
        
        - name: otel-headers
          secret:
            secretName: otel-api-headers
            defaultMode: 288 # 0440
            items:
              - key: token
                path: headers
        - name: otel-ca
          configMap:
            name: otel-api-ca
            items:
              - key: bundle.pem
                path: ca.pem
---
# Source: aap-operator/templates/deployment.yaml
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator
        app.kubernetes.io/instance: aap-operator
    spec:
      serviceAccountName: aap-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-agentic-platform/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          args: [run]
          env:
            # K6b: every namespace the operator watches, comma separated (the chart makes the Role and RoleBinding in each).
            # WATCH_NAMESPACE below is the primary, which must be one of them: it names the cluster-scoped objects and the
            # API's defaults.namespace.
            - name: WATCH_NAMESPACES
              value: "agents"
            - name: WATCH_NAMESPACE
              value: "agents"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
            # AD-029: the image of an agent whose AgentConfig names none. A new value rolls those agents, and no other.
            - name: DEFAULT_AGENT_IMAGE
              value: "ghcr.io/vymalo/another-adam-rs/coder:sha-9a1fd4e@sha256:c3c178b7d73599f40d53f798616e510346abd3300a622b09b2bc233109f12b44"
            # Traces (slice K5): the variables `operator run` reads. Absent, no span is made.
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "https://otel-collector.observability.svc:4318/v1/traces"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/json
            - name: OTEL_TRACES_SAMPLER
              value: "traceidratio"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: "0.25"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment.name=prod,k8s.cluster.name=netcup,service.namespace=another-agentic"
            - name: AAP_OTEL_HEADERS_FILE
              value: /var/run/secrets/aap/otel/headers
            - name: OTEL_EXPORTER_OTLP_CERTIFICATE
              value: /etc/aap/otel/ca/ca.pem
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            
            - name: otel-headers
              mountPath: /var/run/secrets/aap/otel
              readOnly: true
            - name: otel-ca
              mountPath: /etc/aap/otel/ca
              readOnly: true
      volumes:
        
        - name: otel-headers
          secret:
            secretName: otel-operator-headers
            defaultMode: 288 # 0440
            items:
              - key: headers
                path: headers
        - name: otel-ca
          configMap:
            name: otel-operator-ca
            items:
              - key: ca.pem
                path: ca.pem
