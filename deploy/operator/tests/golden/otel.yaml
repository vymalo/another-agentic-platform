# Source: aap-operator/templates/deployment.yaml
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator
        app.kubernetes.io/instance: aap-operator
      annotations:
        # The configuration file is read once, at start: a changed file is a new pod (ANR-962).
        checksum/config: e30a5e2970b979ef2c39087a357a123c5fa62f4bcf828d06f178b069230ea84c
    spec:
      serviceAccountName: aap-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-agentic-platform/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          # The file is the only way in (ANR-962): no setting is an environment variable any more.
          args: [run, --config, /etc/aap-operator/config.yaml]
          env:
            # The downward API's identity of this replica (the reporting instance of Events and the lease's holderIdentity).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # K5: the traces' resource names this pod and its namespace; both are the downward API's, not settings.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The configuration file (ANR-962), read once at start.
            - name: config
              mountPath: /etc/aap-operator
              readOnly: true
            
            - name: otel-headers
              mountPath: /var/run/secrets/aap/otel
              readOnly: true
            - name: otel-ca
              mountPath: /etc/aap/otel/ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aap-operator
            defaultMode: 288 # 0440
        
        - name: otel-headers
          secret:
            secretName: otel-operator-headers
            defaultMode: 288 # 0440
            items:
              - key: headers
                path: headers
        - name: otel-ca
          configMap:
            name: otel-operator-ca
            items:
              - key: ca.pem
                path: ca.pem
