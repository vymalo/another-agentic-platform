# The configuration file of the Platform API (bin/api/config.example.yaml). There is no secret in it and no place for one: the API
# checks tokens against the issuer's public keys and reaches the cluster with its ServiceAccount. `listen`, `healthListen` and
# `defaults.namespace` are the chart's (api.port, api.healthPort, the namespace the operator watches).
apiVersion: v1
kind: ConfigMap
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
data:
  config.yaml: |
    cors:
      allowedOrigins: []
    defaults:
      a2aBearer:
        key: AGENT_REGISTRY_AGENT_TOKEN
        name: agent-a2a-bearer
      allowFrom: []
      allowedImageRegistries:
      - ghcr.io
      namespace: agents
      store:
        cnpg:
          instances: 1
          storage:
            size: 5Gi
    healthListen: 0.0.0.0:8081
    listen: 0.0.0.0:8080
    log:
      filter: info
    oidc:
      audiences:
      - another-agentic
      issuer: https://keycloak.example.com/realms/another-agentic
      rolesClaim: agentic_roles
    telemetry:
      otlp:
        certificate: /etc/aap/otel/ca/ca.pem
        endpoint: https://otel-gateway.observability.svc:4319/v1/traces
        headers:
          authorization:
            file: /var/run/secrets/aap/otel/headers
        resourceAttributes:
          deployment.environment.name: prod
        sampler: always_on
    version: 1

---
# Source: aap-operator/templates/config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: aap-operator
  namespace: another-agentic-system
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
data:
  config.yaml: |
    # The configuration of `operator run` (ANR-962, AD-064), rendered by the chart from its values. A typo is refused by the
    # binary at start, and `render-check.sh` runs `operator run --check` on every golden render. THERE IS NO SECRET IN IT: the
    # registry's token and the traces' headers are mounted files this file names, and an agent's secret is a reference.
    version: 1
    listen:
      health: 0.0.0.0:8081
      metrics: 0.0.0.0:9090
      registry: 0.0.0.0:8080
    watch:
      # K6b: every namespace the operator watches, the first being the primary (the API's defaults.namespace, the run pods'
      # cluster-scoped names). Quoted: a namespace YAML would read as a boolean or a number is still a name.
      namespaces:
        - "agents"
    defaults:
      # AD-029: the image of an agent whose AgentConfig names none. A new value rolls those agents, and no other.
      agentImage: "ghcr.io/vymalo/another-adam-rs/coder:sha-b5d1c7e@sha256:5de41376a08d8452ae0c59314e0e34d35da0aae495cdbc72ad6144a9c4235d45"
    log:
      filter: "info"
    # Traces (slice K5): the OTLP/HTTP JSON exporter's settings, as the OTEL_* variables would say them. A header needs an https
    # endpoint, and the headers file holds the value of the header named here (never a `name=value` list).
    telemetry:
      otlp:
        endpoint: "https://otel-collector.observability.svc:4318/v1/traces"
        sampler: traceidratio
        samplerRatio: 0.25
        resourceAttributes:
          deployment.environment.name: prod
          k8s.cluster.name: netcup
          service.namespace: another-agentic
        headers:
          "authorization":
            file: /var/run/secrets/aap/otel/headers
        certificate: /etc/aap/otel/ca/ca.pem

