# Source: aap-operator/templates/api-deployment.yaml
# The Platform API (bin/api): stateless, so more than one replica is fine. A rolling update that surges and loses no pod; the pod stays in
# the Service for a few seconds before the signal (preStop), then the API drains for at most 25 s, inside the grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator-api
      app.kubernetes.io/instance: aap-operator
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator-api
        app.kubernetes.io/instance: aap-operator
        app.kubernetes.io/component: api
      annotations:
        # A change of the configuration rolls the pods (the file is read once, at start).
        checksum/config: f986037ffe60e2d6e1369bce9f5b36a59a50ead02b75f19c06250bdfddccf0eb
    spec:
      serviceAccountName: aap-operator-api
      # The API token is the API's way to the cluster.
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 40
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted headers file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: "ghcr.io/vymalo/another-agentic-platform/api:sha-0000000"
          imagePullPolicy: IfNotPresent
          # Everything is the file's (ANR-970): the three ports, the log's filter and the traces. The binary reads no
          # environment variable of its own any more.
          args: ["--config", "/etc/aap-api/config.yaml"]
          env:
            # Traces (slice K5): the resource's identity, the downward API's; the rest of the section is the file's.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: health
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready while the issuer's keys can be had and the cluster answers a call that needs the API's own rights (bin/api/README.md).
          # A pod that is draining answers 503 at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          # The Service takes a moment to drop an endpoint: keep serving until it has. The distroless image has no `sleep` to run, so
          # this is the kubelet's own sleep action (on from Kubernetes 1.30 and GA in 1.34; the chart's floor is 1.37: values.yaml).
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/aap-api
              readOnly: true
            
            - name: otel-headers
              mountPath: /var/run/secrets/aap/otel
              readOnly: true
            - name: otel-ca
              mountPath: /etc/aap/otel/ca
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: aap-operator-api
        
        - name: otel-headers
          secret:
            secretName: otel-api-headers
            defaultMode: 288 # 0440
            items:
              - key: token
                path: headers
        - name: otel-ca
          configMap:
            name: otel-api-ca
            items:
              - key: bundle.pem
                path: ca.pem

