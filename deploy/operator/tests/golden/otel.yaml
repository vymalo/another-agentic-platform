# Source: aap-operator/templates/api-networkpolicy.yaml
# Ingress is closed except the peers of api.networkPolicy.from (the edge) on the API port; the health port has no rule, because the
# kubelet's probes come from the node, which a NetworkPolicy never blocks (as in the operator's policy). Egress is three rules: the API server,
# the cluster's DNS and the issuer's keys. A rule with ports and no `to` allows ANY address on those ports, which is what the API server's
# and the issuer's rules are until apiServer.cidrs and issuer.to are set (README "The NetworkPolicy"); the DNS rule is narrow by default.
# Unlike the operator's, which reaches the API server and nothing else, the API resolves the issuer's name and fetches its keys, so it has
# the two rules more.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aap-operator-api
  labels:
    app.kubernetes.io/name: aap-operator-api
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aap-operator-api
      app.kubernetes.io/instance: aap-operator
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: TCP
          port: 4319
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: otel-gateway
---
# Source: aap-operator/templates/networkpolicy.yaml
# Ingress is closed except what is listed: the registry to the peers of networkPolicy.registry.allowFrom, /metrics to those of
# networkPolicy.metrics.allowFrom. Probes come from the node, which a NetworkPolicy never blocks. Egress goes to the API server and,
# when the deployment asks for them, the traces collector and the tool probe's peers, and nothing else: the operator reads and writes
# the API and calls no other service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - protocol: TCP
          port: 4318
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
