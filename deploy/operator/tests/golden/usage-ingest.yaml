# Source: aap-operator/templates/deployment.yaml
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator
        app.kubernetes.io/instance: aap-operator
    spec:
      serviceAccountName: aap-operator
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: "ghcr.io/vymalo/another-agentic-platform/operator:sha-0000000"
          imagePullPolicy: IfNotPresent
          args: [run]
          env:
            # K6b: every namespace the operator watches, comma separated (the chart makes the Role and RoleBinding in each).
            # WATCH_NAMESPACE below is the primary, which must be one of them: it names the cluster-scoped objects and the
            # API's defaults.namespace.
            - name: WATCH_NAMESPACES
              value: "another-agentic-system"
            - name: WATCH_NAMESPACE
              value: "another-agentic-system"
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
            # AD-029: the image of an agent whose AgentConfig names none. A new value rolls those agents, and no other.
            - name: DEFAULT_AGENT_IMAGE
              value: "ghcr.io/vymalo/another-adam-rs/coder:sha-9a1fd4e@sha256:c3c178b7d73599f40d53f798616e510346abd3300a622b09b2bc233109f12b44"
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            limits:
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
---
# Source: aap-operator/templates/usage-ingest.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aap-operator-usage-ingest
  labels:
    app.kubernetes.io/name: aap-operator-usage-ingest
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: usage-ingest
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: aap-operator-usage-ingest
      app.kubernetes.io/instance: aap-operator
      app.kubernetes.io/component: usage-ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aap-operator-usage-ingest
        app.kubernetes.io/instance: aap-operator
        app.kubernetes.io/component: usage-ingest
    spec:
      serviceAccountName: aap-operator-usage-ingest
      # The token is the ingest's way to the API server (TokenReview).
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted connection string (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: usage-ingest
          image: "ghcr.io/vymalo/another-agentic-platform/usage-ingest:sha-0000000"
          imagePullPolicy: IfNotPresent
          env:
            - name: USAGE_LISTEN_ADDR
              value: "0.0.0.0:8090"
            - name: HEALTH_ADDR
              value: "0.0.0.0:8091"
            - name: DATABASE_URL_FILE
              value: /etc/usage-ingest/db/uri
            - name: USAGE_TOKEN_AUDIENCE
              value: "another-usage-ingest"
            - name: USAGE_METER_SUBJECT
              value: "system:serviceaccount:another-agentic-system:usage-meter"
            - name: USAGE_LEDGER_SUBJECT
              value: "system:serviceaccount:another-agentic-system:usage-ledger"
            - name: USAGE_LAG_SECS
              value: "300"
            - name: RUST_LOG
              value: "info"
          ports:
            - name: http
              containerPort: 8090
              protocol: TCP
            - name: health
              containerPort: 8091
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database
              mountPath: /etc/usage-ingest/db
              readOnly: true
            - name: tls
              mountPath: /etc/usage-ingest/tls
              readOnly: true
      volumes:
        - name: database
          secret:
            secretName: usage-db-app
            defaultMode: 0440
            items:
              - key: uri
                path: uri
        - name: tls
          secret:
            secretName: usage-ingest-tls
            defaultMode: 0440
