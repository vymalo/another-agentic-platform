# The one cluster-scoped right: the API server's TokenReview, which checks a caller's token. `create` on that resource and nothing else;
# no Secret, no read of any object. TokenReview has no namespaced form, so a Role cannot grant it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aap-operator-usage-ingest-another-agentic-system
  labels:
    app.kubernetes.io/name: aap-operator-usage-ingest
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: usage-ingest
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
