---
# Source: aap-operator/templates/networkpolicy.yaml
# Ingress is closed except what is listed: the registry to the peers of networkPolicy.registry.allowFrom, /metrics to those of
# networkPolicy.metrics.allowFrom. Probes come from the node, which a NetworkPolicy never blocks. Egress goes to the API server and,
# when the deployment asks for them, the traces collector and the tool probe's peers, and nothing else: the operator reads and writes
# the API and calls no other service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aap-operator
  labels:
    app.kubernetes.io/name: aap-operator
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aap-operator
      app.kubernetes.io/instance: aap-operator
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
---
# Source: aap-operator/templates/usage-ingest.yaml
# Ingress: the meter's pods and the ledger's pods on the ingest port, nobody else (the kubelet's probes come from the node, which a policy
# never blocks). Egress: the API server (TokenReview), DNS and the database's pods; a rule with ports and no `to` allows any address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aap-operator-usage-ingest
  labels:
    app.kubernetes.io/name: aap-operator-usage-ingest
    app.kubernetes.io/instance: aap-operator
    app.kubernetes.io/component: usage-ingest
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: another-agentic-platform
    helm.sh/chart: aap-operator-0.1.0
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: aap-operator-usage-ingest
      app.kubernetes.io/instance: aap-operator
      app.kubernetes.io/component: usage-ingest
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: another-agentic-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: usage-meter
      ports:
        - protocol: TCP
          port: 8090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: another-agentic-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: usage-ledger
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
      to:
        - ipBlock:
            cidr: 10.96.0.1/32
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - protocol: TCP
          port: 5432
      to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: usage-db
