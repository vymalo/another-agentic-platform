{{- $namespaces := include "aap.watchNamespaces" . | fromJsonArray -}}
{{- range $i, $ns := $namespaces }}
{{- if $i }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aap.fullname" $ }}
  namespace: {{ $ns }}
  labels:
    {{- include "aap.labels" $ | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aap.fullname" $ }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aap.serviceAccountName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
