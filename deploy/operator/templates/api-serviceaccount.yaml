{{- include "aap.validate" . -}}
{{- if and .Values.api.enabled .Values.api.serviceAccount.create }}
# Its own ServiceAccount: the API's rights (the specs people edit, the ExternalSecrets that offer keys) are not the operator's.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aap.api.serviceAccountName" . }}
  labels:
    {{- include "aap.api.labels" . | nindent 4 }}
  {{- with .Values.api.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
