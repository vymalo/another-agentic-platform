{{- include "aap.validate" . -}}
{{- if .Values.usageIngest.enabled }}
{{- $u := .Values.usageIngest }}
# The usage ingest (bin/usage-ingest). Stateless: the events and the spend are in the CloudNativePG Cluster named by usageIngest.database.
{{- if $u.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aap.usage.serviceAccountName" . }}
  labels:
    {{- include "aap.usage.labels" . | nindent 4 }}
  {{- with $u.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
{{- if $u.rbac.create }}
# The one cluster-scoped right: the API server's TokenReview, which checks a caller's token. `create` on that resource and nothing else;
# no Secret, no read of any object. TokenReview has no namespaced form, so a Role cannot grant it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "aap.usage.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "aap.usage.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "aap.usage.fullname" . }}-{{ .Release.Namespace }}
  labels:
    {{- include "aap.usage.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "aap.usage.fullname" . }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aap.usage.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aap.usage.fullname" . }}
  labels:
    {{- include "aap.usage.labels" . | nindent 4 }}
spec:
  replicas: {{ $u.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "aap.usage.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aap.usage.selectorLabels" . | nindent 8 }}
        {{- with $u.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $u.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aap.usage.serviceAccountName" . }}
      # The token is the ingest's way to the API server (TokenReview).
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted connection string (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: usage-ingest
          image: {{ include "aap.usage.image" . | quote }}
          imagePullPolicy: {{ $u.image.pullPolicy }}
          env:
            - name: USAGE_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%d" (int $u.port) | quote }}
            - name: HEALTH_ADDR
              value: {{ printf "0.0.0.0:%d" (int $u.healthPort) | quote }}
            - name: DATABASE_URL_FILE
              value: /etc/usage-ingest/db/{{ $u.database.key }}
            - name: USAGE_TOKEN_AUDIENCE
              value: {{ $u.identity.audience | quote }}
            - name: USAGE_METER_SUBJECT
              value: {{ $u.identity.meterSubject | quote }}
            - name: USAGE_LEDGER_SUBJECT
              value: {{ $u.identity.ledgerSubject | quote }}
            - name: USAGE_LAG_SECS
              value: {{ int $u.lagSecs | quote }}
            - name: RUST_LOG
              value: {{ $u.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ $u.port }}
              protocol: TCP
            - name: health
              containerPort: {{ $u.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          resources:
            {{- toYaml $u.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database
              mountPath: /etc/usage-ingest/db
              readOnly: true
            {{- if $u.tls.secretName }}
            - name: tls
              mountPath: /etc/usage-ingest/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: database
          secret:
            secretName: {{ include "aap.usage.databaseSecret" . }}
            defaultMode: 0440
            items:
              - key: {{ $u.database.key }}
                path: {{ $u.database.key }}
        {{- if $u.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ $u.tls.secretName }}
            defaultMode: 0440
        {{- end }}
      {{- with $u.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $u.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aap.usage.fullname" . }}
  labels:
    {{- include "aap.usage.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aap.usage.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $u.port }}
      targetPort: http
      protocol: TCP
{{- if $u.networkPolicy.enabled }}
{{- $np := $u.networkPolicy }}
---
# Ingress: the meter's pods and the ledger's pods on the ingest port, nobody else (the kubelet's probes come from the node, which a policy
# never blocks). Egress: the API server (TokenReview), DNS and the database's pods; a rule with ports and no `to` allows any address.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aap.usage.fullname" . }}
  labels:
    {{- include "aap.usage.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aap.usage.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml $np.meterFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $u.port }}
    - from:
        {{- toYaml $np.ledgerFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $u.port }}
  egress:
    - ports:
        {{- range $np.apiServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with $np.apiServer.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    - ports:
        {{- range $np.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with $np.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        {{- range $np.database.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $np.database.to | nindent 8 }}
{{- end }}
{{- end }}
