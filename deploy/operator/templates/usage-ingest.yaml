{{- include "aap.validate" . -}}
{{- if .Values.usageIngest.enabled }}
{{- $u := .Values.usageIngest }}
{{- $name := include "aap.usageIngest.fullname" . }}
# The usage ingest (bin/usage-ingest): stateless over Postgres, so more than one replica is fine.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "aap.usageIngest.serviceAccountName" . }}
  labels:
    {{- include "aap.usageIngest.labels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "aap.usageIngest.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aap.usageIngest.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ $u.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "aap.usageIngest.labels" . | nindent 4 }}
spec:
  replicas: {{ $u.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "aap.usageIngest.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aap.usageIngest.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "aap.usageIngest.serviceAccountName" . }}
      # The token is the ingest's way to TokenReview.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $u.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: usage-ingest
          image: {{ include "aap.usageIngest.image" . | quote }}
          imagePullPolicy: {{ $u.image.pullPolicy }}
          env:
            - name: USAGE_LISTEN_ADDR
              value: {{ printf "0.0.0.0:%d" (int $u.port) | quote }}
            - name: HEALTH_ADDR
              value: {{ printf "0.0.0.0:%d" (int $u.healthPort) | quote }}
            # A file, never a value: the connection string holds a password and comes from the app Secret of the Cluster.
            - name: DATABASE_URL_FILE
              value: /etc/usage-ingest/db/{{ $u.database.secretKey }}
            - name: USAGE_TOKEN_AUDIENCE
              value: {{ $u.audience | quote }}
            - name: USAGE_METER_SUBJECT
              value: {{ $u.meterSubject | quote }}
            - name: USAGE_LEDGER_SUBJECT
              value: {{ $u.ledgerSubject | quote }}
            - name: USAGE_LAG_SECS
              value: {{ int $u.lagSecs | quote }}
            - name: RUST_LOG
              value: {{ $u.logLevel | quote }}
          ports:
            - name: http
              containerPort: {{ $u.port }}
              protocol: TCP
            - name: health
              containerPort: {{ $u.healthPort }}
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          resources:
            {{- toYaml $u.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database
              mountPath: /etc/usage-ingest/db
              readOnly: true
      volumes:
        - name: database
          secret:
            secretName: {{ $u.database.secretName }}
            items:
              - key: {{ $u.database.secretKey }}
                path: {{ $u.database.secretKey }}
            defaultMode: 0440
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  labels:
    {{- include "aap.usageIngest.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aap.usageIngest.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  # Ingress: the meter's and the ledger's peers on the ingest port, nobody else. The health port has no rule: the kubelet's probes
  # come from the node.
  ingress:
    - from:
        {{- toYaml $u.networkPolicy.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ $u.port }}
  egress:
    # The API server (TokenReview).
    - ports:
        {{- range $u.networkPolicy.apiServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with $u.networkPolicy.apiServer.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    - ports:
        {{- range $u.networkPolicy.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $u.networkPolicy.dns.to | nindent 8 }}
    # The database, and nothing else.
    - ports:
        - protocol: TCP
          port: {{ $u.database.port }}
      to:
        {{- toYaml $u.networkPolicy.database.to | nindent 8 }}
{{- if $u.tokenReview.clusterRole.create }}
---
# The one cluster-scoped object of the chart, and only on request: TokenReview is create-only and cluster-scoped, so a Role cannot grant it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-tokenreview
  labels:
    {{- include "aap.usageIngest.labels" . | nindent 4 }}
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-tokenreview
  labels:
    {{- include "aap.usageIngest.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-tokenreview
subjects:
  - kind: ServiceAccount
    name: {{ include "aap.usageIngest.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
