{{- include "aap.validate" . -}}
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aap.fullname" . }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "aap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aap.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (include "aap.runPods" .) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "aap.runPods" . }}
        # The settings for run pods are read once, at start: a changed file is a new pod.
        checksum/run-pods: {{ include (print $.Template.BasePath "/run-pods-settings.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aap.serviceAccountName" . }}
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "aap.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [run]
          env:
            - name: WATCH_NAMESPACE
              value: {{ include "aap.watchNamespace" . | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.defaultAgentImage }}
            # AD-029: the image of an agent whose AgentConfig names none. A new value rolls those agents, and no other.
            - name: DEFAULT_AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.tuning.concurrency }}
            - name: AAP_CONCURRENCY
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.tuning.resyncSecs }}
            - name: AAP_RESYNC_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.tuning.resyncPendingSecs }}
            - name: AAP_RESYNC_PENDING_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- if include "aap.runPods" . }}
            # Run pods (slice D15a): present, the operator has them, with the size classes, image and quota this file says. Absent, it has none
            # and an AgentConfig that asks for them is ConfigInvalid.
            - name: RUN_PODS_FILE
              value: /etc/aap/run-pods/settings.yaml
            {{- end }}
            {{- if include "aap.registrySecretName" . }}
            # No token, no registry: this variable is what turns it on.
            - name: REGISTRY_TOKEN_FILE
              value: /var/run/secrets/aap/registry/token
            {{- with .Values.registry.publicUrl }}
            - name: REGISTRY_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            {{- if include "aap.registrySecretName" . }}
            - name: registry
              containerPort: 8080
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          {{- if or (include "aap.registrySecretName" .) (include "aap.runPods" .) }}
          volumeMounts:
            {{- if include "aap.registrySecretName" . }}
            - name: registry-token
              mountPath: /var/run/secrets/aap/registry
              readOnly: true
            {{- end }}
            {{- if include "aap.runPods" . }}
            - name: run-pods
              mountPath: /etc/aap/run-pods
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or (include "aap.registrySecretName" .) (include "aap.runPods" .) }}
      volumes:
        {{- if include "aap.registrySecretName" . }}
        - name: registry-token
          secret:
            secretName: {{ include "aap.registrySecretName" . }}
            defaultMode: 288 # 0440
            items:
              - key: {{ include "aap.registrySecretKey" . }}
                path: token
        {{- end }}
        {{- if include "aap.runPods" . }}
        - name: run-pods
          configMap:
            name: {{ include "aap.runPodsSettings" . }}
            defaultMode: 288 # 0440
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
