{{- include "aap.validate" . -}}
{{- $tuning := default (dict) .Values.tuning -}}
{{- if gt (int .Values.replicas) 1 }}
# K7: more than one replica is a rolling update whose replicas campaign for a Lease in the primary namespace, and only its
# holder reconciles. Both replicas keep their caches and serve the registry, so `/readyz` keeps its meaning (the caches have
# listed) and the PodDisruptionBudget can move the lease.
{{- else }}
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aap.fullname" . }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if gt (int .Values.replicas) 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "aap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aap.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- if or .Values.podAnnotations (include "aap.runPods" .) }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if include "aap.runPods" . }}
        # The settings for run pods are read once, at start: a changed file is a new pod.
        checksum/run-pods: {{ include (print $.Template.BasePath "/run-pods-settings.yaml") . | sha256sum }}
        {{- end }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "aap.serviceAccountName" . }}
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "aap.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [run]
          env:
            # K6b: every namespace the operator watches, comma separated (the chart makes the Role and RoleBinding in each).
            # WATCH_NAMESPACE below is the primary, which must be one of them: it names the cluster-scoped objects and the
            # API's defaults.namespace.
            - name: WATCH_NAMESPACES
              value: {{ include "aap.watchNamespaces" . | fromJsonArray | join "," | quote }}
            - name: WATCH_NAMESPACE
              value: {{ include "aap.watchNamespace" . | quote }}
            {{- if gt (int .Values.replicas) 1 }}
            # K7: the lease every replica campaigns for; the holder reconciles, the others keep their caches and serve the registry.
            - name: LEADER_ELECTION_ENABLED
              value: "true"
            - name: LEADER_ELECTION_NAME
              value: {{ include "aap.fullname" . | quote }}
            - name: LEADER_ELECTION_NAMESPACE
              value: {{ include "aap.watchNamespace" . | quote }}
            - name: LEADER_ELECTION_LEASE_SECS
              value: {{ .Values.leaderElection.leaseSecs | quote }}
            - name: LEADER_ELECTION_RENEW_SECS
              value: {{ .Values.leaderElection.renewSecs | quote }}
            - name: LEADER_ELECTION_RETRY_SECS
              value: {{ .Values.leaderElection.retrySecs | quote }}
            {{- end }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- with .Values.defaultAgentImage }}
            # AD-029: the image of an agent whose AgentConfig names none. A new value rolls those agents, and no other.
            - name: DEFAULT_AGENT_IMAGE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.cacheAllowedClaims }}
            # K1: the claims an AgentConfig may name as its package cache (environment.cache.existingClaim). Absent: none may.
            - name: CACHE_ALLOWED_CLAIMS
              value: {{ join "," .Values.cacheAllowedClaims | quote }}
            {{- end }}
            {{- if and .Values.maxAccessTier (ne (toString .Values.maxAccessTier) "auto") }}
            # K1: the highest access tier an AgentConfig may ask for, and the one an agent that asks for none gets when it is below auto.
            - name: AGENT_MAX_ACCESS_TIER
              value: {{ .Values.maxAccessTier | quote }}
            {{- end }}
            {{- if .Values.toolProbe.to }}
            # K3b: probe a ToolProvider's MCP server. The chart turns it on with the peers above; the timeout is the deployment's.
            - name: TOOL_PROBE_ENABLED
              value: "true"
            - name: TOOL_PROBE_TIMEOUT_SECS
              value: {{ .Values.toolProbe.timeoutSecs | default 5 | quote }}
            {{- end }}
            {{- with $tuning.concurrency }}
            - name: AAP_CONCURRENCY
              value: {{ . | quote }}
            {{- end }}
            {{- with $tuning.resyncSecs }}
            - name: AAP_RESYNC_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- with $tuning.resyncPendingSecs }}
            - name: AAP_RESYNC_PENDING_SECS
              value: {{ . | quote }}
            {{- end }}
            {{- if or $tuning.reconcileTimeoutSecs (gt (int .Values.replicas) 1) }}
            # K7: with the election on, a pass must finish before the lease margin (the default 4 s is below the 5 s
            # lease - renew); with one replica the binary's own 60 s applies.
            - name: AAP_RECONCILE_TIMEOUT_SECS
              value: {{ $tuning.reconcileTimeoutSecs | default 4 | quote }}
            {{- end }}
            {{- if include "aap.otel.on" . }}
            # Traces (slice K5): the variables `operator run` reads. Absent, no span is made.
            {{- include "aap.otel.env" (dict "block" .Values.otel "pod" true) | nindent 12 }}
            {{- end }}
            {{- if include "aap.runPods" . }}
            # Run pods (slice D15a): present, the operator has them, with the size classes, image and quota this file says. Absent, it has none
            # and an AgentConfig that asks for them is ConfigInvalid.
            - name: RUN_PODS_FILE
              value: /etc/aap/run-pods/settings.yaml
            {{- end }}
            {{- if include "aap.registrySecretName" . }}
            # No token, no registry: this variable is what turns it on.
            - name: REGISTRY_TOKEN_FILE
              value: /var/run/secrets/aap/registry/token
            {{- with .Values.registry.publicUrl }}
            - name: REGISTRY_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
          ports:
            {{- if include "aap.registrySecretName" . }}
            - name: registry
              containerPort: 8080
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          {{- if or (include "aap.registrySecretName" .) (include "aap.runPods" .) (and (include "aap.otel.on" .) (include "aap.otel.hasVolumes" (dict "block" .Values.otel))) }}
          volumeMounts:
            {{- if include "aap.registrySecretName" . }}
            - name: registry-token
              mountPath: /var/run/secrets/aap/registry
              readOnly: true
            {{- end }}
            {{- if include "aap.runPods" . }}
            - name: run-pods
              mountPath: /etc/aap/run-pods
              readOnly: true
            {{- end }}
            {{- if include "aap.otel.on" . }}
            {{- include "aap.otel.mounts" (dict "block" .Values.otel) | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or (include "aap.registrySecretName" .) (include "aap.runPods" .) (and (include "aap.otel.on" .) (include "aap.otel.hasVolumes" (dict "block" .Values.otel))) }}
      volumes:
        {{- if include "aap.registrySecretName" . }}
        - name: registry-token
          secret:
            secretName: {{ include "aap.registrySecretName" . }}
            defaultMode: 288 # 0440
            items:
              - key: {{ include "aap.registrySecretKey" . }}
                path: token
        {{- end }}
        {{- if include "aap.runPods" . }}
        - name: run-pods
          configMap:
            name: {{ include "aap.runPodsSettings" . }}
            defaultMode: 288 # 0440
        {{- end }}
        {{- if include "aap.otel.on" . }}
        {{- include "aap.otel.volumes" (dict "block" .Values.otel) | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
