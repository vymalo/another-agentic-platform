{{- include "aap.validate" . -}}
{{- $tuning := default (dict) .Values.tuning -}}
{{- if gt (int .Values.replicas) 1 }}
# K7: more than one replica is a rolling update whose replicas campaign for a Lease in the primary namespace, and only its
# holder reconciles. Both replicas keep their caches and serve the registry, so `/readyz` keeps its meaning (the caches have
# listed) and the PodDisruptionBudget can move the lease.
{{- else }}
# One replica and no leader election (§59a): a second reconciler would only race the first. `Recreate`, so an upgrade
# never runs two at once; the cost is a short gap in reconciling, and a running agent is not touched by it.
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aap.fullname" . }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  {{- if gt (int .Values.replicas) 1 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  {{- else }}
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      {{- include "aap.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aap.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        # The configuration file is read once, at start: a changed file is a new pod (ANR-962).
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "aap.serviceAccountName" . }}
      # The API token is the operator's way in.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      # SIGTERM lets the passes in flight finish.
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        # So the mounted token file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: {{ include "aap.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The file is the only way in (ANR-962): no setting is an environment variable any more.
          args: [run, --config, /etc/aap-operator/config.yaml]
          env:
            # The downward API's identity of this replica (the reporting instance of Events and the lease's holderIdentity).
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- if include "aap.otel.on" . }}
            # K5: the traces' resource names this pod and its namespace; both are the downward API's, not settings.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- end }}
          ports:
            {{- if include "aap.registrySecretName" . }}
            - name: registry
              containerPort: 8080
              protocol: TCP
            {{- end }}
            - name: health
              containerPort: 8081
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready once both controllers' caches have listed the cluster.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            # The configuration file (ANR-962), read once at start.
            - name: config
              mountPath: /etc/aap-operator
              readOnly: true
            {{- if include "aap.registrySecretName" . }}
            - name: registry-token
              mountPath: /var/run/secrets/aap/registry
              readOnly: true
            {{- end }}
            {{- if include "aap.activity" . }}
            - name: activity-token
              mountPath: /var/run/secrets/aap/activity
              readOnly: true
            {{- end }}
            {{- if include "aap.metering" . }}
            - name: metering-token
              mountPath: /var/run/secrets/aap/metering
              readOnly: true
            {{- end }}
            {{- if include "aap.otel.on" . }}
            {{- include "aap.otel.mounts" (dict "block" .Values.otel) | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aap.fullname" . }}
            defaultMode: 288 # 0440
        {{- if include "aap.registrySecretName" . }}
        - name: registry-token
          secret:
            secretName: {{ include "aap.registrySecretName" . }}
            defaultMode: 288 # 0440
            items:
              - key: {{ include "aap.registrySecretKey" . }}
                path: token
        {{- end }}
        {{- if include "aap.activity" . }}
        - name: activity-token
          secret:
            secretName: {{ .Values.activity.tokenSecret.name }}
            defaultMode: 288 # 0440
            items:
              - key: {{ .Values.activity.tokenSecret.key }}
                path: token
        {{- end }}
        {{- if include "aap.metering" . }}
        - name: metering-token
          secret:
            secretName: {{ .Values.metering.broker.tokenSecret.name }}
            defaultMode: 288 # 0440
            items:
              - key: {{ .Values.metering.broker.tokenSecret.key }}
                path: broker-token
        {{- end }}
        {{- if include "aap.otel.on" . }}
        {{- include "aap.otel.volumes" (dict "block" .Values.otel) | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
