{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy -}}
# Ingress is closed except what is listed: the registry to the peers of networkPolicy.registry.allowFrom, /metrics to those of
# networkPolicy.metrics.allowFrom. Probes come from the node, which a NetworkPolicy never blocks. Egress goes to the API server and,
# when the deployment asks for them, the traces collector and the tool probe's peers, and nothing else: the operator reads and writes
# the API and calls no other service.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aap.fullname" . }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aap.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  {{- if or (include "aap.registrySecretName" .) $np.metrics.allowFrom }}
  ingress:
    {{- if include "aap.registrySecretName" . }}
    - from:
        {{- toYaml $np.registry.allowFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- if $np.metrics.allowFrom }}
    - from:
        {{- toYaml $np.metrics.allowFrom | nindent 8 }}
      ports:
        - protocol: TCP
          port: 9090
    {{- end }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    - ports:
        {{- range $np.apiServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with $np.apiServer.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    {{- if include "aap.otel.on" . }}
    {{- /* Traces (slice K5): DNS and the collector, each to peers the chart requires, so neither is open egress. */}}
    {{- $o := .Values.otel }}
    - ports:
        {{- range $o.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $o.dns.to | nindent 8 }}
    - ports:
        {{- range $o.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $o.to | nindent 8 }}
    {{- end }}
    {{- if .Values.toolProbe.to }}
    {{- /* The tool probe (slice K3a, AD-053): DNS to resolve a provider's URL, and exactly the peers and ports the deployment listed. */}}
    {{- $t := .Values.toolProbe }}
    - ports:
        {{- range $t.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $t.dns.to | nindent 8 }}
    - ports:
        {{- range $t.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $t.to | nindent 8 }}
    {{- end }}
    {{- if include "aap.metering" . }}
    {{- /* The pod-minute meter (ANR-1103): DNS to resolve the broker and the collector, then exactly the peers the deployment listed, each on its own port. */}}
    {{- $mt := .Values.metering }}
    - ports:
        {{- range $mt.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $mt.dns.to | nindent 8 }}
    - ports:
        - protocol: TCP
          port: {{ $mt.broker.port | int }}
      to:
        {{- toYaml $mt.broker.to | nindent 8 }}
    - ports:
        - protocol: TCP
          port: {{ $mt.collector.port | int }}
      to:
        {{- toYaml $mt.collector.to | nindent 8 }}
    {{- end }}
    {{- if include "aap.activity" . }}
    {{- /* The activity source (AD-058 P2c): DNS to resolve an agent's service name, and exactly the peers the deployment listed, on the agents' port. */}}
    {{- $a := .Values.activity }}
    - ports:
        {{- range $a.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      to:
        {{- toYaml $a.dns.to | nindent 8 }}
    - ports:
        - protocol: TCP
          port: {{ $a.port | int }}
      to:
        {{- toYaml $a.to | nindent 8 }}
    {{- end }}
{{- end }}
