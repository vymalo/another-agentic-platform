{{- include "aap.validate" . -}}
{{- if .Values.api.enabled }}
{{- $api := .Values.api }}
# The Platform API (bin/api): stateless, so more than one replica is fine. A rolling update that surges and loses no pod; the pod stays in
# the Service for a few seconds before the signal (preStop), then the API drains for at most 25 s, inside the grace period.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aap.api.fullname" . }}
  labels:
    {{- include "aap.api.labels" . | nindent 4 }}
spec:
  replicas: {{ $api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "aap.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "aap.api.selectorLabels" . | nindent 8 }}
        {{- with $api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # A change of the configuration rolls the pods (the file is read once, at start).
        checksum/config: {{ include (print $.Template.BasePath "/api-configmap.yaml") . | sha256sum }}
        {{- with $api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "aap.api.serviceAccountName" . }}
      # The API token is the API's way to the cluster.
      automountServiceAccountToken: true
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      terminationGracePeriodSeconds: {{ $api.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        {{- if or (include "aap.api.workloadEnabled" .) (and $api.otel.enabled $api.otel.headersSecret.name) }}
        # So the mounted headers file (mode 0440) is readable by the non-root user.
        fsGroup: 65532
        {{- end }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: {{ include "aap.api.image" . | quote }}
          imagePullPolicy: {{ $api.image.pullPolicy }}
          env:
            - name: API_CONFIG_FILE
              value: /etc/aap-api/config.yaml
            - name: RUST_LOG
              value: {{ $api.logLevel | quote }}
            {{- if $api.otel.enabled }}
            # Traces (slice K5): the variables `api` reads. Absent, no span is made.
            {{- include "aap.otel.env" (dict "block" $api.otel "pod" false) | nindent 12 }}
            {{- end }}
            {{- with $api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ $api.port }}
              protocol: TCP
            - name: health
              containerPort: {{ $api.healthPort }}
              protocol: TCP
            {{- if include "aap.api.workloadEnabled" . }}
            - name: workload
              containerPort: {{ $api.workload.port }}
              protocol: TCP
            {{- end }}
            {{- if include "aap.api.metricsExposed" . }}
            - name: metrics
              containerPort: {{ $api.metrics.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 4
          # Ready while the issuer's keys can be had and the cluster answers a call that needs the API's own rights (bin/api/README.md).
          # A pod that is draining answers 503 at once.
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 4
          {{- if gt (int $api.preStopSleepSeconds) 0 }}
          # The Service takes a moment to drop an endpoint: keep serving until it has. The distroless image has no `sleep` to run, so
          # this is the kubelet's own sleep action (on from Kubernetes 1.30 and GA in 1.34; the chart's floor is 1.37: values.yaml).
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int $api.preStopSleepSeconds }}
          {{- end }}
          resources:
            {{- toYaml $api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/aap-api
              readOnly: true
            {{- if include "aap.api.workloadEnabled" . }}
            # The server certificate and the CA bundle of the workload listener (ANR-1011): files, never a value of the configuration.
            - name: workload-tls
              mountPath: /etc/aap-api-workload/tls
              readOnly: true
            - name: workload-ca
              mountPath: /etc/aap-api-workload/ca
              readOnly: true
            {{- end }}
            {{- if $api.otel.enabled }}
            {{- include "aap.otel.mounts" (dict "block" $api.otel) | nindent 12 }}
            {{- end }}
            {{- with $api.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "aap.api.fullname" . }}
        {{- if include "aap.api.workloadEnabled" . }}
        - name: workload-tls
          secret:
            secretName: {{ $api.workload.tls.secretName | quote }}
            defaultMode: 288 # 0440
        - name: workload-ca
          configMap:
            name: {{ $api.workload.clientCa.configMap | quote }}
            items:
              - key: {{ $api.workload.clientCa.key | quote }}
                path: ca.crt
        {{- end }}
        {{- if $api.otel.enabled }}
        {{- include "aap.otel.volumes" (dict "block" $api.otel) | nindent 8 }}
        {{- end }}
        {{- with $api.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
