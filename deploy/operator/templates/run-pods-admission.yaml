{{- if include "aap.runPods" . }}
{{- $namespaces := include "aap.watchNamespaces" . | fromJsonArray -}}
# runPods.enabled: the guard that lets an agent's account make pods without being able to read the namespace's other Secrets, mount
# the host or run anything privileged. It is the coder chart's policy (adam-rs `run-pods-admission.yaml`) with what differs per agent
# read from a parameter: a ConfigMap of the agent's, labelled {{ include "aap.runPodsPolicyLabel" . }}, which the operator makes for each agent
# that asks for run pods (the account it is for, the images, the claims, the one Secret key). It applies to the pods CREATED BY
# that account (the match condition, once per parameter object), and refuses any that is not the intended run pod. Without it the RBAC
# alone would let the account make any pod in its namespace. The policy and its binding are cluster-scoped and made here: the operator
# is namespaced, and writes only the parameters, which the account cannot (its Role has pods and nothing else).
# `parameterNotFoundAction: Allow`: a namespace in which no agent asks for run pods has no parameter, and every pod creation in it
# would be denied by `Deny`, the operator's own among them. The cost is stated in the README ("Run pods"): an account whose parameters
# are gone is not guarded, so the operator makes the parameters before the binding that lets the account make pods and removes the
# binding first. Needs the v1 admission policy API (Kubernetes 1.30 or later) and `params` in a match condition, which was verified on a
# kube-apiserver v1.35.8 only: the oldest version where it works is not known (README "Run pods").
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "aap.runPodsPolicy" . }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  paramKind:
    apiVersion: v1
    kind: ConfigMap
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE"]
        resources: ["pods"]
  matchConditions:
    - name: made-by-the-coder
      expression: "request.userInfo.username == params.data.serviceAccount"
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    {{- /* K14a (AD-052), ANR-402: the class the pods of this agent run under is the one its size class names, else the deployment's. The
       operator writes that one into the parameters (it knows the agent's class); the chart's deployment-wide value is the fallback for
       an operator older than this policy, so that a skew refuses rather than admits. The rule exists when the deployment names a
       class or any size class does, and is absent from every render when none does. */}}
    {{- $runtime := .Values.runPods.runtimeClassName | default "" }}
    {{- $classRuntime := false }}
    {{- range $name, $class := .Values.runPodClasses }}
    {{- if and (kindIs "map" $class) (get $class "runtimeClassName") }}{{ $classRuntime = true }}{{ end }}
    {{- end }}
    {{- if or $runtime $classRuntime }}
    - name: runtimeClass
      expression: "has(params.data.runtimeClassName) ? params.data.runtimeClassName : '{{ $runtime }}'"
    {{- end }}
    {{- /* ANR-660 (AD-065): the node types the deployment admits, as a list (one value per line in the parameters, as the images are). The
       variable and the rule below exist only when the deployment names them, so every other render is what it was. */}}
    {{- if and .Values.runPods.nodeType.labelKey .Values.runPods.nodeType.admitted }}
    - name: admittedNodeTypes
      expression: "has(params.data.nodeTypeAdmitted) ? params.data.nodeTypeAdmitted.split('\\n') : []"
    {{- end }}
  validations:
    {{- if $runtime }}
    {{- /* K14a (AD-052) decision 2: named, the class is REQUIRED. A run pod of the agent's account with another class, or none, is
       refused, so the sandbox cannot be skipped by whoever holds the account's token. */}}
    - expression: "has(object.spec.runtimeClassName) && object.spec.runtimeClassName == variables.runtimeClass"
      messageExpression: "'a run pod runs under the RuntimeClass ' + variables.runtimeClass + ' (the deployment sandboxes run pods)'"
    {{- else if $classRuntime }}
    {{- /* ANR-402: only some size classes name a class. An agent whose class names none has no parameter, so the variable is empty and
       the rule judges nothing; an agent whose class names one is held to it, as above. */}}
    - expression: "variables.runtimeClass == '' || (has(object.spec.runtimeClassName) && object.spec.runtimeClassName == variables.runtimeClass)"
      messageExpression: "'a run pod runs under the RuntimeClass ' + variables.runtimeClass + ' (its size class sandboxes run pods)'"
    {{- end }}
    - expression: "has(object.metadata.labels) && params.data.runLabel in object.metadata.labels && 'app.kubernetes.io/managed-by' in object.metadata.labels && object.metadata.labels['app.kubernetes.io/managed-by'] == params.data.managedBy"
      messageExpression: "'a run pod carries the labels app.kubernetes.io/managed-by=' + params.data.managedBy + ' and ' + params.data.runLabel"
    - expression: "has(object.spec.priorityClassName) && object.spec.priorityClassName == params.data.priorityClass"
      messageExpression: "'a run pod has the priority class ' + params.data.priorityClass + ', which the quota is scoped to'"
    - expression: "variables.containers.all(c, c.image in params.data.images.split('\\n'))"
      message: "a run pod uses only the images the chart allows"
    - expression: "!has(object.spec.volumes) || object.spec.volumes.all(v, has(v.emptyDir) || (has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName in (has(params.data.claims) ? params.data.claims.split('\\n') : [params.data.claim])))"
      messageExpression: "'a run pod mounts only emptyDir volumes and the ' + ((has(params.data.claims) ? params.data.claims.split('\\n') : [params.data.claim]).size() > 1 ? 'claims ' : 'claim ') + (has(params.data.claims) ? params.data.claims.split('\\n') : [params.data.claim]).join(' and ') + ': no hostPath, no Secret, no other claim'"
    - expression: "variables.containers.all(c, (!has(c.env) || c.env.all(e, !has(e.valueFrom) || !has(e.valueFrom.secretKeyRef) || (e.valueFrom.secretKeyRef.name == params.data.secretName && e.valueFrom.secretKeyRef.key == params.data.secretKey))) && (!has(c.envFrom) || c.envFrom.all(f, !has(f.secretRef))))"
      messageExpression: "'a run pod references no Secret but the key ' + params.data.secretKey + ' of ' + params.data.secretName + ' (as one variable): no Secret volume, no envFrom, no other key'"
    - expression: "variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) && c.securityContext.allowPrivilegeEscalation == false && (!has(c.securityContext.privileged) || c.securityContext.privileged == false))"
      message: "a run pod is not privileged and sets allowPrivilegeEscalation: false on every container"
    - expression: "variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.runAsUser) ? c.securityContext.runAsUser : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsUser) ? object.spec.securityContext.runAsUser : 0)) != 0 && (has(c.securityContext) && has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot : (has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) ? object.spec.securityContext.runAsNonRoot : false)))"
      message: "a run pod does not run as root: a runAsUser other than 0 and runAsNonRoot: true on every container"
    - expression: "(!has(object.spec.hostNetwork) || !object.spec.hostNetwork) && (!has(object.spec.hostPID) || !object.spec.hostPID) && (!has(object.spec.hostIPC) || !object.spec.hostIPC)"
      message: "a run pod uses its own network, PID and IPC namespaces"
    - expression: "has(object.spec.automountServiceAccountToken) && object.spec.automountServiceAccountToken == false"
      message: "a run pod sets automountServiceAccountToken: false: it holds no credential for the cluster"
    {{- /* AD-061: the one rule this chart has that the coder chart's policy does not. Its place is last, so that the first nine are the coder
       chart's in the coder chart's order (the parity test compares them one by one and holds this one apart). */}}
    - expression: "variables.containers.all(c, has(c.resources) && has(c.resources.limits) && 'memory' in c.resources.limits && 'cpu' in c.resources.limits && 'ephemeral-storage' in c.resources.limits)"
      message: "a run pod sets limits.memory, limits.cpu and limits.ephemeral-storage on every container"
    {{- if and .Values.runPods.nodeType.labelKey .Values.runPods.nodeType.admitted }}
    {{- /* ANR-660 (AD-065), appended last: with the parameters' nodeTypeKey set, a run pod is PINNED to the admitted node types and has no
       spec.nodeName (which would skip the scheduler). Pinned is `nodeSelector[key]` in the admitted values, or required node affinity with
       at least one term of which EVERY term has a matchExpressions entry `key In <only admitted values>` (the terms are alternatives: one
       without it lets the pod go anywhere; Exists, NotIn and matchFields-only terms do not count). The policy cannot read a Node's labels:
       it proves the pod is pinned, and that the labels are honest is the administrator's. Silent when the parameters have no nodeTypeKey. */}}
    - expression: "!has(params.data.nodeTypeKey) || (!has(object.spec.nodeName) && ((has(object.spec.nodeSelector) && params.data.nodeTypeKey in object.spec.nodeSelector && object.spec.nodeSelector[params.data.nodeTypeKey] in variables.admittedNodeTypes) || (has(object.spec.affinity) && has(object.spec.affinity.nodeAffinity) && has(object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution) && object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.size() > 0 && object.spec.affinity.nodeAffinity.requiredDuringSchedulingIgnoredDuringExecution.nodeSelectorTerms.all(t, has(t.matchExpressions) && t.matchExpressions.exists(e, e.key == params.data.nodeTypeKey && e.operator == 'In' && has(e.values) && e.values.size() > 0 && e.values.all(v, v in variables.admittedNodeTypes))))))"
      messageExpression: "'a run pod is pinned to the node types ' + variables.admittedNodeTypes.join(', ') + ' (' + params.data.nodeTypeKey + ' In those values, by nodeSelector or by required node affinity in every term) and sets no nodeName'"
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "aap.runPodsPolicy" . }}
  labels:
    {{- include "aap.labels" . | nindent 4 }}
spec:
  policyName: {{ include "aap.runPodsPolicy" . }}
  validationActions: ["Deny"]
  paramRef:
    selector:
      matchLabels:
        {{ include "aap.runPodsPolicyLabel" . }}: "true"
    parameterNotFoundAction: Allow
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- toYaml $namespaces | nindent 12 }}
{{- end }}
