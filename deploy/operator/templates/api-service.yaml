{{- include "aap.validate" . -}}
{{- if .Values.api.enabled }}
# The API, cluster-internal: the route from outside is the edge's (api.ingress, or the deployment's own). The health port is not exposed.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aap.api.fullname" . }}
  labels:
    {{- include "aap.api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aap.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- if and .Values.api.enabled (include "aap.api.metricsExposed" .) }}
---
# /metrics of the API on a Service of its own: the API's port never carries it, and the NetworkPolicy opens it to api.metrics.allowFrom only.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aap.api.fullname" . }}-metrics
  labels:
    {{- include "aap.api.labels" . | nindent 4 }}
    aap.vymalo.com/scrape: metrics
spec:
  type: ClusterIP
  selector:
    {{- include "aap.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.api.metrics.port }}
      targetPort: metrics
      protocol: TCP
{{- end }}
{{- if include "aap.api.workloadEnabled" . }}
---
# The workload listener (mutual TLS) on a Service of its own: the person's Service never carries it, and the NetworkPolicy opens it to
# api.workload.from only. The edge's Ingress does not route to it: a workload is inside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aap.api.fullname" . }}-workload
  labels:
    {{- include "aap.api.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "aap.api.selectorLabels" . | nindent 4 }}
  ports:
    - name: workload
      port: {{ .Values.api.workload.port }}
      targetPort: workload
      protocol: TCP
{{- end }}
