{{- include "aap.validate" . -}}
{{- if and .Values.api.enabled .Values.api.networkPolicy.enabled }}
{{- $np := .Values.api.networkPolicy -}}
# Ingress is closed except the peers of api.networkPolicy.from (the edge) on the API port; the health port has no rule, because the
# kubelet's probes come from the node, which a NetworkPolicy never blocks (as in the operator's policy). Egress is three rules: the API server,
# the cluster's DNS and the issuer's keys. A rule with ports and no `to` allows ANY address on those ports, which is what the API server's
# and the issuer's rules are until apiServer.cidrs and issuer.to are set (README "The NetworkPolicy"); the DNS rule is narrow by default.
# Unlike the operator's, which reaches the API server and nothing else, the API resolves the issuer's name and fetches its keys, so it has
# the two rules more.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aap.api.fullname" . }}
  labels:
    {{- include "aap.api.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "aap.api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- toYaml $np.from | nindent 8 }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    - ports:
        {{- range $np.apiServer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with $np.apiServer.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    - ports:
        {{- range $np.dns.ports }}
        - protocol: UDP
          port: {{ . }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with $np.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        {{- range $np.issuer.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
      {{- with $np.issuer.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
