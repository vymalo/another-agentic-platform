{{- include "aap.validate" . -}}
{{- if .Values.api.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aap.api.fullname" . }}
  namespace: {{ include "aap.api.namespace" . }}
  labels:
    {{- include "aap.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aap.api.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aap.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
