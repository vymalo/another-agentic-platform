apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: agentservices.agents.vymalo.com
spec:
  group: agents.vymalo.com
  names:
    categories: []
    kind: AgentService
    plural: agentservices
    shortNames: []
    singular: agentservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.configRef.name
      name: Config
      type: string
    - jsonPath: .status.runtime.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: A durable, addressable adam-rs agent service. It names an AgentConfig and the operator makes the workload, Service, NetworkPolicy and storage for it.
        properties:
          spec:
            description: |-
              The desired state of an agent as a service: which config it runs, which interfaces it
              serves, how it scales and where its ledger lives.
            properties:
              access:
                default:
                  allowFrom: []
                description: Who may reach the service.
                properties:
                  allowFrom:
                    default: []
                    description: |-
                      Peers allowed to reach port 8080: the `from` of a NetworkPolicy ingress rule. There is no
                      egress rule: the agent needs git hosts, the model gateway and registries.
                    items:
                      description: NetworkPolicyPeer describes a peer to allow traffic to/from. Only certain combinations of fields are allowed
                      properties:
                        ipBlock:
                          description: ipBlock defines policy on a particular IPBlock. If this field is set then neither of the other fields can be.
                          properties:
                            cidr:
                              description: cidr is a string representing the IPBlock Valid examples are "192.168.1.0/24" or "2001:db8::/64"
                              type: string
                            except:
                              description: except is a slice of CIDRs that should not be included within an IPBlock Valid examples are "192.168.1.0/24" or "2001:db8::/64" Except values will be rejected if they are outside the cidr range
                              items:
                                type: string
                              type: array
                          required:
                          - cidr
                          type: object
                        namespaceSelector:
                          description: |-
                            namespaceSelector selects namespaces using cluster-scoped labels. This field follows standard label selector semantics; if present but empty, it selects all namespaces.

                            If podSelector is also set, then the NetworkPolicyPeer as a whole selects the pods matching podSelector in the namespaces selected by namespaceSelector. Otherwise it selects all pods in the namespaces selected by namespaceSelector.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                              items:
                                description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector applies to.
                                    type: string
                                  operator:
                                    description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                        podSelector:
                          description: |-
                            podSelector is a label selector which selects pods. This field follows standard label selector semantics; if present but empty, it selects all pods.

                            If namespaceSelector is also set, then the NetworkPolicyPeer as a whole selects the pods matching podSelector in the Namespaces selected by NamespaceSelector. Otherwise it selects the pods matching podSelector in the policy's own namespace.
                          properties:
                            matchExpressions:
                              description: matchExpressions is a list of label selector requirements. The requirements are ANDed.
                              items:
                                description: A label selector requirement is a selector that contains values, a key, and an operator that relates the key and values.
                                properties:
                                  key:
                                    description: key is the label key that the selector applies to.
                                    type: string
                                  operator:
                                    description: operator represents a key's relationship to a set of values. Valid operators are In, NotIn, Exists and DoesNotExist.
                                    type: string
                                  values:
                                    description: values is an array of string values. If the operator is In or NotIn, the values array must be non-empty. If the operator is Exists or DoesNotExist, the values array must be empty. This array is replaced during a strategic merge patch.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - key
                                - operator
                                type: object
                              type: array
                            matchLabels:
                              additionalProperties:
                                type: string
                              description: matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels map is equivalent to an element of matchExpressions, whose key field is "key", the operator is "In", and the values array contains only "value". The requirements are ANDed.
                              type: object
                          type: object
                      type: object
                    type: array
                  audience:
                    description: |-
                      Who may use the agent in a client (AD-028): the values of the person's roles claim that
                      admit them. By convention a value is the agent's use permission, `agent.use:<agent-name>`
                      (10 characters and the name, so a name of at most 54 fits the 64 of a value; the dashboard
                      makes names of at most 40); `*` admits everyone. Absent or empty: administrators only. The
                      CRD checks only the shape; what the values mean is the consumer's rule. It reaches no pod: it
                      goes to the registry item as `audience` (slice D3: each value once, in byte order), and
                      nothing enforces it before slice D8.
                    items:
                      maxLength: 64
                      minLength: 1
                      type: string
                    maxItems: 32
                    nullable: true
                    type: array
                    x-kubernetes-validations:
                    - message: 'access.audience: the value * is only allowed alone'
                      rule: '!self.exists(a, a == ''*'') || self.size() == 1'
                    - message: 'access.audience: a value is visible ASCII characters, with no space or control character'
                      rule: self.all(a, a.matches('^[!-~]+$'))
                type: object
              account:
                description: |-
                  The account this agent's own pods' minutes are for: the person's opaque id from the identity provider (the `sub`,
                  trimmed and lower-cased), 1 to 128 bytes of `[A-Za-z0-9._:/-]`; an `@` is never one, so an e-mail is not an account.
                  The Platform API writes it only for a caller that holds `platform:agents.own`; write access to the `AgentService`
                  itself is the trust boundary. Absent: nobody's, a shared agent.
                  Changing it never restarts the agent (it is not in the digest). It is **not** `owner`, the orchestrator's pseudonym.
                maxLength: 128
                minLength: 1
                nullable: true
                pattern: ^[A-Za-z0-9._:/-]+$
                type: string
              configRef:
                description: The AgentConfig, in the same namespace, this service runs.
                properties:
                  name:
                    description: Name of the referenced object.
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              deletionPolicy:
                default: Retain
                description: What happens to data (work volumes, an operator-owned database) when the service is deleted.
                enum:
                - Retain
                - Delete
                type: string
              description:
                description: What the agent does, in a sentence. Listed in the agent registry.
                nullable: true
                type: string
              interfaces:
                default:
                  a2a:
                    enabled: false
                  mcp:
                    enabled: false
                  responses:
                    enabled: false
                description: The protocol surfaces the service serves. Nothing is exposed by default.
                properties:
                  a2a:
                    default:
                      enabled: false
                    description: The A2A surface.
                    properties:
                      bearerTokensSecretRef:
                        description: |-
                          The Secret key that holds the bearer tokens (`A2A_BEARER_TOKENS`). No token, no server:
                          the agent fails closed.
                        nullable: true
                        properties:
                          key:
                            description: Key inside the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                      enabled:
                        default: false
                        description: |-
                          Serve A2A. Without it the agent is not listed in the registry. Off when omitted, as before K1 (adam-rs's
                          operator defaults it to on: a manifest that writes `a2a` with only a token reference must not turn a
                          disabled agent on at the next apply, so this operator does not, and says so in the superset test).
                        type: boolean
                      publicUrl:
                        description: 'The URL clients reach the agent at (`PUBLIC_URL`). Empty: `http://<name>.<ns>.svc:8080/`.'
                        nullable: true
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: 'interfaces.a2a needs bearerTokensSecretRef: no token, no server'
                      rule: (has(self.enabled) && !self.enabled) || has(self.bearerTokensSecretRef)
                  mcp:
                    default:
                      enabled: false
                    description: The MCP surface. Exists for the target design; v0 refuses `true`.
                    properties:
                      enabled:
                        default: false
                        description: Must be false in v0.
                        type: boolean
                        x-kubernetes-validations:
                        - message: 'v0 serves A2A only: this interface cannot be enabled'
                          rule: self == false
                    type: object
                  responses:
                    default:
                      enabled: false
                    description: The Responses surface. Exists for the target design; v0 refuses `true`.
                    properties:
                      enabled:
                        default: false
                        description: Must be false in v0.
                        type: boolean
                        x-kubernetes-validations:
                        - message: 'v0 serves A2A only: this interface cannot be enabled'
                          rule: self == false
                    type: object
                type: object
              owner:
                description: |-
                  The person or account this agent belongs to, as the orchestrator names them: 1 to 63 characters of
                  lower-case letters, digits, `-` and `_`. Absent: nobody's, and no owner-scoped route of the Platform API
                  can touch it. Changing it never restarts the agent (it is not in the digest). It is **not** the Kubernetes
                  owner reference of a pod.
                maxLength: 63
                minLength: 1
                nullable: true
                pattern: ^[a-z0-9][a-z0-9_-]*$
                type: string
              registry:
                default:
                  tags: []
                description: How the agent is listed in the agent registry.
                properties:
                  tags:
                    default: []
                    description: Free-form tags.
                    items:
                      type: string
                    type: array
                  title:
                    description: Display title.
                    nullable: true
                    type: string
                type: object
              release:
                description: |-
                  The release channels of the service (AD-059, §10a). Absent: one revision, replaced in place, and the
                  workload keeps the name `<service>`. Present: a channel is a pointer to an `AgentConfig`, and the
                  operator names a workload per live revision (`<service>-r<n>`). The dashboard's forms cannot say it:
                  an object that carries it is YAML only.
                nullable: true
                properties:
                  channels:
                    additionalProperties:
                      description: |-
                        What a channel points at: the `AgentConfig` whose revision serves it. The same shape as `configRef`, so a
                        channel's image, model and tools are what that config says.
                      properties:
                        configRef:
                          description: The `AgentConfig`, in the service's namespace, the channel points at.
                          properties:
                            name:
                              description: Name of the referenced object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - configRef
                      type: object
                    description: 'Channel name to what it points at: at most 8 channels.'
                    maxProperties: 8
                    type: object
                  defaultChannel:
                    description: The channel a request that names none gets. One of `channels`.
                    maxLength: 32
                    minLength: 1
                    type: string
                required:
                - channels
                - defaultChannel
                type: object
                x-kubernetes-validations:
                - message: 'release.channels: a channel name is at most 32 characters of lower-case letters, digits and -, starting and ending with a letter or a digit'
                  rule: self.channels.all(k, k.size() <= 32 && k.matches('^[a-z0-9]([a-z0-9-]*[a-z0-9])?$'))
                - message: release.defaultChannel names one of release.channels
                  rule: self.defaultChannel in self.channels
              scaling:
                default:
                  topology: combined
                  workers: 1
                description: How many processes run, and in which topology.
                properties:
                  activityProbe:
                    description: |-
                      How the operator asks the agent whether it holds work (AD-075, the contract `activity/v1`), for an
                      agent whose probe is not derived: an adam-rs agent's probe is the activity listener the operator
                      renders. Off unless set, and it changes nothing without `idleTimeout`.
                    nullable: true
                    properties:
                      httpGet:
                        description: 'Where the agent serves the contract: its port and path.'
                        properties:
                          path:
                            description: 'The path: absolute, it starts with `/`.'
                            type: string
                            x-kubernetes-validations:
                            - message: 'scaling.activityProbe.httpGet.path is an absolute path: it starts with `/`'
                              rule: self.startsWith('/')
                          port:
                            description: 'The port the agent serves the contract on: 1 to 65535.'
                            format: int32
                            maximum: 65535.0
                            minimum: 1.0
                            type: integer
                        required:
                        - path
                        - port
                        type: object
                      periodSeconds:
                        default: 30
                        description: 'How often the agent is asked, in seconds: 1 to 3600. Default 30.'
                        format: int32
                        maximum: 3600.0
                        minimum: 1.0
                        type: integer
                      timeoutSeconds:
                        default: 2
                        description: 'How long one question may take, in seconds: 1 to 60. Default 2.'
                        format: int32
                        maximum: 60.0
                        minimum: 1.0
                        type: integer
                      tokenSecretRef:
                        description: |-
                          The Secret and key the **agent's pod** reads its copy of the bearer from, by reference only. The
                          operator sends the bearer it holds in its own configuration and never reads this Secret (AD-024).
                        nullable: true
                        properties:
                          key:
                            description: Key inside the Secret.
                            minLength: 1
                            type: string
                          name:
                            description: Name of the Secret.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - httpGet
                    type: object
                  front:
                    description: The front of a `split` topology.
                    nullable: true
                    properties:
                      replicas:
                        default: 1
                        description: Replicas of `<name>-front`. A PodDisruptionBudget is made when there is more than one.
                        format: int32
                        minimum: 1.0
                        type: integer
                    type: object
                  idleTimeout:
                    description: |-
                      How long the agent must report no work before it sleeps (scaled to zero). A duration such as
                      `15m`, from `1m` to `24h`. Absent: the agent never sleeps (AD-058).
                    nullable: true
                    type: string
                    x-kubernetes-validations:
                    - message: scaling.idleTimeout is a duration from 1m to 24h, such as 15m
                      rule: self.matches('^[1-9][0-9]*[smh]$') && duration(self) >= duration('1m') && duration(self) <= duration('24h')
                  topology:
                    default: combined
                    description: '`combined`: one workload runs every role. `split`: a control plane (`<name>-front`) and workers.'
                    enum:
                    - combined
                    - split
                    type: string
                  wakeAhead:
                    description: |-
                      How long before a scheduled firing a sleeping agent is woken. A duration from `10s` to `1h`.
                      Only with `idleTimeout`; absent: 2m.
                    nullable: true
                    type: string
                    x-kubernetes-validations:
                    - message: scaling.wakeAhead is a duration from 10s to 1h, such as 2m
                      rule: self.matches('^[1-9][0-9]*[smh]$') && duration(self) >= duration('10s') && duration(self) <= duration('1h')
                  wakeTimeout:
                    description: |-
                      How long a request waits for a sleeping agent to wake before the caller is told to retry.
                      A duration from `5s` to `5m`. Only with `idleTimeout`; absent: 60s.
                    nullable: true
                    type: string
                    x-kubernetes-validations:
                    - message: scaling.wakeTimeout is a duration from 5s to 5m, such as 60s
                      rule: self.matches('^[1-9][0-9]*[smh]$') && duration(self) >= duration('5s') && duration(self) <= duration('5m')
                  workers:
                    default: 1
                    description: Replicas of the workload `<name>` (the adam workers as pods).
                    format: int32
                    minimum: 1.0
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: 'scaling.front is only allowed with topology: split'
                  rule: '!has(self.front) || self.topology == ''split'''
                - message: scaling.wakeAhead and scaling.wakeTimeout need scaling.idleTimeout
                  rule: has(self.idleTimeout) || (!has(self.wakeAhead) && !has(self.wakeTimeout))
                - message: scaling.activityProbe needs scaling.idleTimeout
                  rule: has(self.idleTimeout) || !has(self.activityProbe)
              store:
                description: Where the agent's durable run ledger lives.
                properties:
                  postgres:
                    description: A PostgreSQL ledger.
                    properties:
                      cnpg:
                        description: An operator-owned CloudNativePG `Cluster` `<name>-db`.
                        nullable: true
                        properties:
                          instances:
                            default: 1
                            description: Instances of the cluster.
                            format: int32
                            minimum: 1.0
                            type: integer
                          postgresql:
                            description: 'PostgreSQL parameters: only `shared_buffers`, `max_connections` and `work_mem`.'
                            nullable: true
                            properties:
                              parameters:
                                additionalProperties:
                                  type: string
                                description: |-
                                  Parameter name to value. The names allowed are `shared_buffers`, `max_connections` and
                                  `work_mem` (the operator refuses any other); each value is at most 32 characters.
                                type: object
                            required:
                            - parameters
                            type: object
                          resources:
                            description: 'CPU and memory requests and limits of each instance. Unset: none (the pod is BestEffort).'
                            nullable: true
                            properties:
                              claims:
                                description: |-
                                  Claims lists the names of resources, defined in spec.resourceClaims, that are used by this container.

                                  This is an alpha field and requires enabling the DynamicResourceAllocation feature gate.

                                  This field is immutable. It can only be set for containers.
                                items:
                                  description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                                  properties:
                                    name:
                                      description: Name must match the name of one entry in pod.spec.resourceClaims of the Pod where this field is used. It makes that resource available inside a container.
                                      type: string
                                    request:
                                      description: Request is the name chosen for a request in the referenced claim. If empty, everything from the claim is made available, otherwise only the result of this request.
                                      type: string
                                  required:
                                  - name
                                  type: object
                                type: array
                              limits:
                                additionalProperties:
