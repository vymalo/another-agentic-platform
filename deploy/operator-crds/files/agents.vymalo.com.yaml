                    description: The read-only GitHub MCP server, as a native sidecar.
                    nullable: true
                    properties:
                      host:
                        description: '`GITHUB_HOST` of the sidecar, for GitHub Enterprise. Empty or unset: github.com.'
                        nullable: true
                        type: string
                      port:
                        default: 8082
                        description: Its loopback port. Checked again by the reconciler.
                        format: int32
                        maximum: 65535.0
                        minimum: 1.0
                        type: integer
                      sidecar:
                        default: true
                        description: Run the sidecar.
                        type: boolean
                    type: object
                  mcpServers:
                    additionalProperties:
                      description: |-
                        One extra MCP server: a `ToolProvider` by name (`providerRef`), or the URL and headers inline,
                        never both.
                      properties:
                        headers:
                          additionalProperties:
                            description: A header whose value is a Secret key.
                            properties:
                              prefix:
                                description: Plain text put in front of the secret, e.g. `Bearer `.
                                nullable: true
                                type: string
                              secretRef:
                                description: The Secret key that holds the value. It is named by the variable that carries it.
                                properties:
                                  key:
                                    description: Key inside the Secret.
                                    minLength: 1
                                    type: string
                                  name:
                                    description: Name of the Secret.
                                    minLength: 1
                                    type: string
                                required:
                                - key
                                - name
                                type: object
                            required:
                            - secretRef
                            type: object
                          default: {}
                          description: Request headers, by header name. Each value is a Secret key. Not with `providerRef`.
                          type: object
                        optional:
                          default: false
                          description: |-
                            The agent starts without it when it is unreachable. Beside a `providerRef` the provider has an
                            `optional` of its own, and the server is optional when either says so.
                          type: boolean
                        providerRef:
                          description: |-
                            A `ToolProvider` of the same namespace that holds the URL and the headers (AD-029).
                            Exclusive with `url` and `headers`. The operator reads the provider into the same entry of the
                            extra MCP file the inline form gives (§60a), so an edit of the provider rolls every agent that
                            uses it. A provider that is not there makes the agent `ConfigInvalid`, naming it.
                          nullable: true
                          properties:
                            name:
                              description: Name of the referenced object.
                              minLength: 1
                              type: string
                          required:
                          - name
                          type: object
                        url:
                          description: |-
                            Its `http` or `https` URL, with no user name, password or `${…}` in it (checked by the
                            reconciler). Required unless `providerRef` is set.
                          nullable: true
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: mcpServers.providerRef is exclusive with url and headers
                        rule: '!has(self.providerRef) || (!has(self.url) && (!has(self.headers) || self.headers.size() == 0))'
                      - message: an MCP server needs a url, or a providerRef
                        rule: has(self.providerRef) || has(self.url)
                    default: {}
                    description: |-
                      Extra MCP servers, by name, at most 32 (the bound lets an API server price the CEL rules of
                      a server). Written to a ConfigMap that holds `${VAR}` references only.
                    maxProperties: 32
                    type: object
                type: object
            required:
            - environment
            - harness
            type: object
            x-kubernetes-validations:
            - message: harness.type adam-rs needs spec.model
              rule: self.harness.type != 'adam-rs' || has(self.model)
          status:
            description: What the controller observed of an AgentConfig.
            nullable: true
            properties:
              conditions:
                default: []
                description: '`Valid`.'
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: The `metadata.generation` the controller last validated.
                format: int64
                nullable: true
                type: integer
            type: object
        required:
        - spec
        title: AgentConfig
        type: object
    served: true
    storage: true
    subresources:
      status: {}
