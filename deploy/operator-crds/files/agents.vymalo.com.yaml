apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelendpoints.agents.vymalo.com
spec:
  group: agents.vymalo.com
  names:
    categories: []
    kind: ModelEndpoint
    plural: modelendpoints
    shortNames: []
    singular: modelendpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.title
      name: Title
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: An OpenAI-compatible model endpoint, set once and named by the AgentConfigs that use it (spec.model.endpointRef).
        properties:
          spec:
            description: |-
              An OpenAI-compatible model endpoint and the Secret key of its API key. An `AgentConfig` names
              it with `spec.model.endpointRef`; the operator resolves the reference into the same variables
              the inline `baseUrl` and `apiKeySecretRef` give (§60a). A secret is never a value here (AD-024).
            properties:
              apiKeySecretRef:
                description: The Secret key that holds the API key (`MODEL_API_KEY`).
                properties:
                  key:
                    description: Key inside the Secret.
                    minLength: 1
                    type: string
                  name:
                    description: Name of the Secret.
                    minLength: 1
                    type: string
                required:
                - key
                - name
                type: object
              baseUrl:
                description: 'The endpoint (`MODEL_BASE_URL`): a value or a Secret key.'
                properties:
                  secretRef:
                    description: The Secret key that holds the URL.
                    nullable: true
                    properties:
                      key:
                        description: Key inside the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name of the Secret.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  value:
                    description: The URL.
                    nullable: true
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of baseUrl.value and baseUrl.secretRef
                  rule: has(self.value) != has(self.secretRef)
              models:
                default: []
                description: |-
                  The model aliases the forms offer, at most 32. Informative: nothing checks that the
                  endpoint serves them.
                items:
                  type: string
                maxItems: 32
                type: array
              reasoning:
                additionalProperties:
                  description: |-
                    The reasoning levels one model alias of the endpoint accepts, and nothing else (ADR 0063): an
                    agent's `model.reasoningEffort` must be one of them, and an alias with no entry (or an empty list)
                    takes no reasoning setting.
                  properties:
                    efforts:
                      default: []
                      description: The levels, each at most once, at most the seven of the vocabulary.
                      items:
                        description: |-
                          A reasoning effort a gateway accepts (ADR 0063): the vocabulary of a model profile's
                          `reasoningEfforts`, the seven levels the gateway's probe observed. **`none` is a level of its own**:
                          some models reason unless it is sent, and for the others "off" is the absence of the setting.
                        enum:
                        - none
                        - minimal
                        - low
                        - medium
                        - high
                        - xhigh
                        - max
                        type: string
                      maxItems: 7
                      type: array
                  type: object
                description: |-
                  The reasoning levels each alias accepts (`spec.reasoning.<alias>.efforts`), at most 32 aliases
                  (ADR 0063; the owner's ruling: the levels live on the endpoint, the agent picks among them). An
                  alias with no entry, or with an empty list, takes no reasoning setting. The wire (the
                  `reasoning_effort` member, a `reasoning` object, a thinking budget) belongs to the model's
                  profile in adam's `MODEL_ALIASES_FILE`: the platform only names the levels.
                maxProperties: 32
                type: object
              title:
                description: What the dashboard shows. 1 to 128 characters.
                maxLength: 128
                minLength: 1
                type: string
            required:
            - apiKeySecretRef
            - baseUrl
            - title
            type: object
          status:
            description: |-
              What the controller observed of a `ModelEndpoint` or a `ToolProvider` (§60a, K2): who uses it, whether it is valid and
              whether the agents that use it are `Ready`. **No secret is ever in it**: no header value, no URL with credentials, no
              token; the names are those of `AgentService`s of the object's own namespace.
            nullable: true
            properties:
              conditions:
                default: []
                description: '`Accepted`, `InUse` and `AgentsReady`; on a `ToolProvider` the deployment probes, also `Reachable` (K3b).'
                items:
                  description: Condition contains details for one aspect of the current state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: lastTransitionTime is the last time the condition transitioned from one status to another. This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: message is a human readable message indicating details about the transition. This may be an empty string.
                      type: string
                    observedGeneration:
                      description: observedGeneration represents the .metadata.generation that the condition was set based upon. For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date with respect to the current state of the instance.
                      format: int64
                      type: integer
                    reason:
                      description: reason contains a programmatic identifier indicating the reason for the condition's last transition. Producers of specific condition types may define expected values and meanings for this field, and whether the values are considered a guaranteed API. The value should be a CamelCase string. This field may not be empty.
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: The `metadata.generation` the controller last judged.
                format: int64
                nullable: true
                type: integer
              probe:
                description: |-
                  The MCP server's tools, on a `ToolProvider` the deployment probes (K3b, AD-053). Absent when probing is off, or
                  when the object was not probed (invalid, a header is needed, or the server is unreachable). The reachability is the
                  `Reachable` condition; **no tool description, schema or URL is here**.
                nullable: true
                properties:
                  incomplete:
                    description: |-
                      The server still named a `nextCursor` after the operator read its five pages: there may be more tools than those
                      listed, so the count is a lower bound (absent when false).
                    type: boolean
                  tools:
                    default: []
                    description: |-
                      The tool names the server listed, sorted, each once, **at most 64** (the operator's bound: the schema has none,
                      because only the operator writes it): the rest are counted in `toolsMore`.
                    items:
                      type: string
                    type: array
                  toolsMore:
                    description: How many tool names are not in `tools` (absent when there are at most 64).
                    format: int32
                    type: integer
                type: object
              usedBy:
                default: []
                description: |-
                  The `AgentService`s of the namespace that run a config naming this object, sorted, each once, **at most
                  [`MAX_USED_BY`]** (the operator's bound: the schema has none, because only the operator writes it): the rest are counted
                  in `usedByMore`.
                items:
                  type: string
                type: array
              usedByMore:
                description: How many users are not in `usedBy` (absent when there are at most [`MAX_USED_BY`]).
                format: int32
                type: integer
            type: object
        required:
        - spec
        title: ModelEndpoint
        type: object
    served: true
    storage: true
    subresources:
      status: {}
---
